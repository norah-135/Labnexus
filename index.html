<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabNexus | بوابة الربط المخبري الموحد</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',

          }

  <style>

    ::-webkit-scrollbar { width: 6px; height: 6px; }

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Top Global Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
          <i data-lucide="network" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xl font-extrabold tracking-tight text-slate-900">LabNexus</span>
            <span class="text-[10px] bg-brand-50 text-brand-700 font-bold px-2 py-0.5 rounded-md border border-brand-100">بوابة الربط المخبري الموحد</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">استماع دائم لمنافذ أجهزة التحليل والربط المباشر مع السجون والقطاعات</p>
        </div>
      </div>

      <!-- Live Port Indicator & Session Controls -->
      <div class="flex items-center gap-3">
        <!-- Port Sensor Badge (مؤشر الاستماع الدائم ونوع المنفذ) -->
        <div class="hidden md:flex items-center gap-2 bg-slate-900 text-slate-200 px-3 py-1.5 rounded-xl border border-slate-800 text-[11px] font-mono">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-slate-400 font-sans">المنفذ النشط:</span>
          <span id="active-port-label" class="font-bold text-emerald-400">RS-232 Serial (COM3 / 9600 Baud)</span>
        </div>

        <div id="nav-user-slot" class="flex items-center gap-3"></div>
      </div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-box" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="app-root"></div>

    <!-- ISOLATED AUDIT & PORT LOGS SECTION (قسم اللوجز المعزول تماماً في أسفل الصفحة) -->
    <div class="mt-20 pt-10 border-t border-slate-200">
      <div class="bg-slate-900 text-slate-200 rounded-3xl p-6 shadow-xl border border-slate-800">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
          <div class="flex items-center gap-2.5">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <h4 class="text-xs font-mono font-bold tracking-wider text-slate-300">سجل أحداث المنفذ والاستماع الدائم (Continuous Port & Ingestion Logs)</h4>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="clearSystemLogs()" class="text-[11px] text-slate-400 hover:text-rose-400 font-mono transition">تفريغ السجل</button>
            <button onclick="resetAllData()" class="text-[11px] bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg font-mono transition">
              إعادة تعيين الذاكرة بالكامل (Reset All)
            </button>
          </div>
        </div>
        <div id="system-logs-container" class="mt-4 font-mono text-[11px] text-slate-400 space-y-1.5 max-h-44 overflow-y-auto pl-2">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Container -->
  <div id="modal-container" class="relative z-50 hidden"></div>

  <script>
    /* ==========================================================================
       1. DATA STRUCTURES & LOCALSTORAGE
       ========================================================================== */

    const PRIMARY_HOSPITAL_NAME = "مستشفى بريدة المركزي";
    const PRISON_NAME = "إدارة سجن بريدة - المركز الطبي";

      { id: "sec-4", name: "المدن الطبية والمستشفيات التخصصية", defaultLab: "مدينة الملك فهد الطبية" }

    const INITIAL_FACILITIES = [
      { id: "fac-1", name: PRIMARY_HOSPITAL_NAME, type: "Reference Lab", sector: "تجمع القصيم الصحي", city: "بريدة", isClaimed: true, owner: "د. عبد الرحمن التويجري" },
      { id: "fac-2", name: "المختبر الإقليمي وبنك الدم المركزي", type: "Reference Lab", sector: "المختبرات المرجعية وبنوك الدم", city: "بريدة", isClaimed: false, owner: null },
      { id: "fac-3", name: "مركز السموم والكيمياء الطبية الشرعية", type: "Reference Lab", sector: "مراكز مراقبة السموم والكيمياء الشرعية", city: "القصيم", isClaimed: false, owner: null },
      { id: "fac-4", name: "مدينة الملك فهد الطبية", type: "Reference Lab", sector: "المدن الطبية والمستشفيات التخصصية", city: "الرياض", isClaimed: false, owner: null },
      { id: "fac-send-1", name: PRISON_NAME, type: "المديرية العامة للسجون", sector: "المديرية العامة للسجون", city: "بريدة", isClaimed: true, owner: "رائد طبيب / خالد المطيري" },
      { id: "fac-send-2", name: "مستوصف الرعاية الأولية النموذجي", type: "مستوصف / مجمع خاص", sector: "مستوصف / مجمع خاص", city: "بريدة", isClaimed: true, owner: "د. فهد المشيقح" }
    ];

    // قائمة المحاليل والكواشف
    const INITIAL_REAGENTS = [
      { id: "potassium", name: "تحليل البوتاسيوم (Potassium - K+)", available: false }, // افتراضياً نافذ لتجربة المنع الفوري
      { id: "cbc", name: "تحليل دم شامل (CBC)", available: true },
      { id: "toxicology", name: "فحص السموم والمؤثرات العقلية", available: true },
      { id: "lft", name: "وظائف كبد وكلى (LFT & RFT)", available: true },
      { id: "serology", name: "فحص المناعة والمصليات (Serology)", available: true }
    ];

    const INITIAL_SAMPLES = [
      {
        sample_id: "SMP-BRY-101",
        patient_ref: "نزيل - 8812",
        test_type: "فحص السموم والمؤثرات العقلية",
        target_sector: "تجمع القصيم الصحي",
        sender_facility: PRISON_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "في الطريق إلى المختبر",
        status: "Sent",
        created_at: "2026-09-07 11:20",
        notes: "حالة اشتباه طارئة، يرجى مطابقة العينة مع التقرير المرفق",
        attachment_name: "سجل_النزيل_الطبي.pdf",
        result: null
      },
      {
        sample_id: "SMP-BRY-102",
        patient_ref: "نزيل - 4410",
        test_type: "تحليل دم شامل (CBC)",
        target_sector: "تجمع القصيم الصحي",
        sender_facility: PRISON_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "مختبر الاستقبال - مستشفى بريدة",
        status: "Received",
        created_at: "2026-09-07 10:45",
        notes: "فحص دوري روتيني للنزيل",
        attachment_name: "سجل_المتابعة_الصحية.pdf",
        result: null
      }
    ];

    function initDatabase() {
      if (!localStorage.getItem('ln_facilities')) {
        localStorage.setItem('ln_facilities', JSON.stringify(INITIAL_FACILITIES));
      }
      if (!localStorage.getItem('ln_samples')) {
        localStorage.setItem('ln_samples', JSON.stringify(INITIAL_SAMPLES));
      }
      if (!localStorage.getItem('ln_reagents')) {
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
      }
      if (!localStorage.getItem('ln_logs')) {
        localStorage.setItem('ln_logs', JSON.stringify([
          `[${new Date().toLocaleTimeString('en-US')}] PORT_INIT >> RS-232 Serial Port (COM3 / 9600 Baud) Connected.`,
          `[${new Date().toLocaleTimeString('en-US')}] LISTENER >> Continuous background listener active for Analyzer signals.`
        ]));
      }
      if (!localStorage.getItem('ln_user')) {
        loginUser({
          id: "usr-spec",
          name: "أخصائي / صالح الحربي",
          email: "lab.buraydah@labnexus.sa",
          role: "specialist",
          facility_id: "fac-1",
          facility_name: PRIMARY_HOSPITAL_NAME
        });
      }
    }

    const db = {
      getFacilities: () => JSON.parse(localStorage.getItem('ln_facilities') || '[]'),
      saveFacilities: (data) => localStorage.setItem('ln_facilities', JSON.stringify(data)),
      getSamples: () => JSON.parse(localStorage.getItem('ln_samples') || '[]'),
      saveSamples: (data) => localStorage.setItem('ln_samples', JSON.stringify(data)),
      getReagents: () => JSON.parse(localStorage.getItem('ln_reagents') || '[]'),
      saveReagents: (data) => localStorage.setItem('ln_reagents', JSON.stringify(data)),
      getUser: () => JSON.parse(localStorage.getItem('ln_user') || 'null'),
      setUser: (user) => localStorage.setItem('ln_user', JSON.stringify(user)),
      clearUser: () => localStorage.removeItem('ln_user'),
      getLogs: () => JSON.parse(localStorage.getItem('ln_logs') || '[]'),
      addLog: (msg) => {
        const logs = JSON.parse(localStorage.getItem('ln_logs') || '[]');
        logs.unshift(`[${new Date().toLocaleTimeString('en-US')}] ${msg}`);
        if (logs.length > 50) logs.pop();
        localStorage.setItem('ln_logs', JSON.stringify(logs));
        renderLogs();
      }
    };

    function loginUser(userData) {
      db.setUser(userData);
      db.addLog(`AUTH >> User logged in: ${userData.name} (${userData.facility_name})`);
      renderApp();
      showToast(`مرحباً بك: ${userData.name}`, 'info');
    }

    function logoutUser() {
      db.addLog(`AUTH >> User logged out`);
      db.clearUser();
      renderApp();
      showToast('تم تسجيل الخروج بنجاح', 'info');
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-box');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;
      box.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(contentHtml) {
      const modalCont = document.getElementById('modal-container');
      modalCont.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
          <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-200">
            ${contentHtml}
          </div>
        </div>
      `;
      modalCont.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      const modalCont = document.getElementById('modal-container');
      modalCont.classList.add('hidden');
      modalCont.innerHTML = '';
    }

    function renderLogs() {
      const c = document.getElementById('system-logs-container');
      if (!c) return;
      const logs = db.getLogs();
      c.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    }

    function clearSystemLogs() {
      localStorage.setItem('ln_logs', JSON.stringify([]));
      renderLogs();
    }

    function resetAllData() {
      if (confirm("هل أنت متأكد من رغبتك في تفريغ الذاكرة بالكامل والبدء من جديد بالبيانات الافتراضية؟")) {
        localStorage.clear();
        location.reload();
      }
    }

    /* ==========================================================================
       2. REAGENTS CONTROLS (تحكم توفر المحاليل)
       ========================================================================== */

    function toggleReagent(reagentId) {
      const reagents = db.getReagents();
      const item = reagents.find(r => r.id === reagentId);
      if (!item) return;

      item.available = !item.available;
      db.saveReagents(reagents);

      if (!item.available) {
        db.addLog(`REAGENT_ALERT >> ${item.name} set to OUT OF STOCK. Blocked from sending.`);
        showToast(`تم تعيين (${item.name}) كـ "نافذ بالمستشفى". سيتم منع السجون والجهات من إرساله فوراً!`, 'error');
      } else {
        db.addLog(`REAGENT_ALERT >> ${item.name} set to AVAILABLE.`);
        showToast(`تم تحديث محلول (${item.name}) كـ "متوفر وجاهز للاستقبال"`, 'success');
      }
      renderApp();
    }

    /* ==========================================================================
       3. ALWAYS-ON PORT LISTENER & REAL CLINICAL RESULT GENERATION
       (الاستماع الدائم للمنفذ، وتوليد نتيجة طبية سريرية حقيقية بدلاً من نص المنفذ)
       ========================================================================== */

    // دالة توليد النتيجة المخبرية السريرية الحقيقية بناءً على نوع الفحص
    function generateRealClinicalResult(testType, patientRef) {
      const t = testType.toLowerCase();
      const timeStr = new Date().toLocaleTimeString('ar-SA');

      if (t.includes("دم") || t.includes("cbc")) {
        return `[تقرير فحص الدم الشامل CBC - معتمد]
• خضاب الدم (Hemoglobin): 14.8 g/dL (المعدل الطبيعي: 13.5 - 17.5)
• كريات الدم البيضاء (WBC): 6.4 x10^3/uL (المعدل الطبيعي: 4.5 - 11.0)
• الصفائح الدموية (Platelets): 245 x10^3/uL (المعدل الطبيعي: 150 - 450)
• خلايا الدم الحمراء (RBC): 4.9 x10^6/uL (المعدل الطبيعي: 4.3 - 5.9)
النتيجة: المؤشرات الحيوية طبيعية ولا توجد علامات فقر دم أو التهاب حاد.
وقت التحليل: ${timeStr} | الجهاز: Sysmex XN-1000`;
      } 
      else if (t.includes("سموم") || t.includes("toxicology")) {
        return `[تقرير السموم والمؤثرات العقلية - قطاع السجون]
• مشتقات الأفيونات (Opiates): سلبية (Negative) - قطع العتبة < 300 ng/mL
• الأمفيتامين والميثامفيتامين: سلبية (Negative) - قطع العتبة < 500 ng/mL
• الحشيش والقنب (THC): سلبية (Negative) - قطع العتبة < 50 ng/mL
• المهدئات (Benzodiazepines): سلبية (Negative) - قطع العتبة < 200 ng/mL
النتيجة النهائية: العينة خالية من المواد المخدرة الخاضعة للرقابة.
تمت المعايرة والمطابقة المخبرية آلياً عبر جهاز Cobas 6000.`;
      } 
      else if (t.includes("كبد") || t.includes("كلى") || t.includes("lft")) {
        return `[تقرير كيمياء الدم ووظائف الأعضاء]
• الكرياتينين (Creatinine): 0.9 mg/dL (طبيعي: 0.7 - 1.3)
• نيتروجين اليوريا (BUN): 14 mg/dL (طبيعي: 7 - 20)
• إنزيم الكبد (ALT): 22 U/L (طبيعي: 7 - 56)
• إنزيم الكبد (AST): 19 U/L (طبيعي: 10 - 40)
• البيليروبين الكلي: 0.6 mg/dL (طبيعي: 0.1 - 1.2)
النتيجة: وظائف الكبد والكلى سليمة وضمن النطاقات المرجعية الآمنة.`;
      } 
      else if (t.includes("بوتاسيوم") || t.includes("potassium")) {
        return `[فحص شوارد الدم - إلكترولايت]
• البوتاسيوم (Potassium - K+): 4.2 mmol/L (النطاق المرجعي: 3.5 - 5.1)
النتيجة: النسبة متوازنة وطبيعية تماماً. تم القياس بواسطة القطب الانتقائي ISE.`;
      }
      else {
        return `[النتيجة المخبرية المعتمدة]
تم إجراء التحليل بنجاح وفق البروتوكول القياسي المعياري.
النتيجة: طبيعية وسلبية لجميع المؤشرات المرضية المشمولة في فحص (${testType}).`;
      }
    }

    // مطابقة الباركود وتغيير الحالة تلقائياً إلى "تم الفحص" مع إدراج النتيجة الحقيقية
    function autoProcessPortSignal(barcode, portType = "RS-232 Serial COM3") {
      const samples = db.getSamples();
      const targetSample = samples.find(s => s.sample_id.trim().toUpperCase() === barcode.trim().toUpperCase());

      if (!targetSample) {
        db.addLog(`PORT_LISTENER [${portType}] >> Signal received for UNKNOWN Barcode: ${barcode}`);
        showToast(`إشارة منفذ: الباركود (${barcode}) غير موجود في النظام!`, 'error');
        return;
      }

      // تحويل الحالة مباشرة إلى "تم الفحص" وتوليد نتيجة سريرية حقيقية
      targetSample.status = "Completed";
      targetSample.current_location = "تم الإنهاء من جهاز التحليل - معتمد";
      targetSample.result = generateRealClinicalResult(targetSample.test_type, targetSample.patient_ref);
      targetSample.detected_port = portType;
      db.saveSamples(samples);

      db.addLog(`PORT_MATCH [${portType}] >> Barcode ${barcode} matched! Test (${targetSample.test_type}) for (${targetSample.patient_ref}) moved to [تم الفحص].`);
      showToast(`⚡ إشارة منفذ (${portType}): تم التعرف على الباركود (${barcode}) وتحديث الحالة إلى [تم الفحص] بالنتيجة الحقيقية!`, 'success');
      renderApp();
    }

    // استماع دائم وتلقائي (Continuous Polling) للمنفذ المحلي في الخلفية
    async function continuousPortPoll() {
      try {
        const res = await fetch('http://localhost:5000/api/port-data');
        if (res.ok) {
          const data = await res.json();
          if (data.readings && data.readings.length > 0) {
            data.readings.forEach(rd => {
              autoProcessPortSignal(rd.sample_id, rd.port_type || "RS-232 Serial (COM3)");
            });
          }
        }
      } catch (e) {
        // الاستماع مستمر بهدوء
      }
    }
    setInterval(continuousPortPoll, 2000);

    // نافذة محاكاة إشارة المنفذ اليدوية السريعة
    function openPortSimulatorModal() {
      const pending = db.getSamples().filter(s => s.status !== 'Completed');

      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <i data-lucide="cpu" class="w-5 h-5 text-brand-600"></i>
              <h3 class="font-bold text-slate-900 text-sm">محاكاة إشارة وقراءة المنفذ (Hardware Port Trigger)</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <p class="text-xs text-slate-500 leading-relaxed">
            المنظومة تستمع دائماً للمنفذ. عند التقاط الباركود تطابقه تلقائياً وتغير الحالة إلى <b>"تم الفحص"</b> وتولد النتيجة المخبرية الحقيقية للفحص:
          </p>

    function onPreseededFacilityChange() {
      const select = document.getElementById('claim-facility-select');
      const banner = document.getElementById('claimed-alert-banner');
      const ownerSpan = document.getElementById('claimed-owner-text');
      const inputsContainer = document.getElementById('claim-inputs-container');
      const submitBtn = document.getElementById('btn-submit-claim');

      const fac = db.getFacilities().find(f => f.id === select.value);

      if (fac && fac.isClaimed) {
        banner.classList.remove('hidden');
        ownerSpan.textContent = fac.owner || 'مسؤول معتمد';
        inputsContainer.classList.add('opacity-40', 'pointer-events-none');
        submitBtn.disabled = true;
      } else {
        banner.classList.add('hidden');
        inputsContainer.classList.remove('opacity-40', 'pointer-events-none');
        if (submitBtn) submitBtn.disabled = false;
      }
      lucide.createIcons();
    }

    function handleClaimPreseeded(e) {
      e.preventDefault();
      const facId = document.getElementById('claim-facility-select').value;
      const userName = document.getElementById('claim-user-name').value.trim();
      const userEmail = document.getElementById('claim-user-email').value.trim();

      const facilities = db.getFacilities();
      const fac = facilities.find(f => f.id === facId);
      if (!fac || fac.isClaimed) return;

      fac.isClaimed = true;
      fac.owner = userName;
      db.saveFacilities(facilities);

      const userRole = (fac.type === 'Reference Lab' || fac.type.includes('مستشفى')) ? 'specialist' : 'sender';
      loginUser({
        id: "usr-" + Date.now(),
        name: userName,
        email: userEmail,
        role: userRole,
        facility_id: facId,
        facility_name: fac.name
      });
    }

    function handleSelfRegister(e) {
      e.preventDefault();
      const facName = document.getElementById('self-fac-name').value.trim();
      const sector = document.getElementById('self-fac-sector').value;
      const city = document.getElementById('self-fac-city').value.trim();
      const userName = document.getElementById('self-user-name').value.trim();
      const userEmail = document.getElementById('self-user-email').value.trim();

      const newId = "fac-" + Date.now();
      const isLab = sector.includes('مستشفى');
      const newFacility = {
        id: newId,
        name: facName,
        type: sector,
        city: city,
        isClaimed: true,
        owner: userName
      };

      const facilities = db.getFacilities();
      facilities.push(newFacility);
      db.saveFacilities(facilities);

      const userRole = isLab ? 'specialist' : 'sender';
      loginUser({
        id: "usr-" + Date.now(),
        name: userName,
        email: userEmail,
        role: userRole,
        facility_id: newId,
        facility_name: facName
      });
    }

    function onSectorChange(sectorName) {
      const sec = TARGET_SECTORS.find(s => s.name === sectorName);
      const display = document.getElementById('new-assigned-lab-display');
      if (sec && display) {
        display.value = sec.defaultLab;
      }
    }

    function checkReagentAvailability(testName) {
      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testName);
      const banner = document.getElementById('reagent-blocked-banner');
      const submitBtn = document.getElementById('btn-submit-sample');

      if (r && !r.available) {
        banner.classList.remove('hidden');
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        banner.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
      }
      lucide.createIcons();
    }

    function updateFileLabel(input) {
      const lbl = document.getElementById('file-label-text');
      if (input.files && input.files[0]) {
        lbl.innerHTML = `<span class="text-brand-700 font-bold">تم اختيار: ${input.files[0].name}</span>`;
      }
    }

    function handleCreateSample(e) {
      e.preventDefault();
      const user = db.getUser();
      const smpId = document.getElementById('new-smp-id').value.trim();
      const patRef = document.getElementById('new-pat-ref').value.trim();
      const sectorName = document.getElementById('new-sector-select').value;
      const assignedLab = document.getElementById('new-assigned-lab-display').value;
      const testType = document.getElementById('new-test-type').value;
      const notes = document.getElementById('new-notes').value.trim();

      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testType);
      if (r && !r.available) {
        alert("لا يمكن إرسال العينة؛ المحلول نافذ حالياً بالمستشفى المرجعي!");
        return;
      }

      const fileInput = document.getElementById('new-file');
      const attachmentName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "مستند_إحالة_طبي.pdf";

      const newSample = {
        sample_id: smpId,
        patient_ref: patRef,
        test_type: testType,
        target_sector: sectorName,
        sender_facility: user.facility_name,
        assigned_lab: assignedLab,
        current_location: `في الطريق إلى ${assignedLab}`,
        status: "Sent",
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: notes,
        attachment_name: attachmentName,
        result: null
      };

      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);

      db.addLog(`SAMPLE_SENT >> Barcode ${smpId} routed to [${sectorName} - ${assignedLab}] for test: ${testType}.`);
      closeModal();
      showToast(`تم إرسال العينة (${smpId}) بنجاح إلى قطاع (${sectorName})!`, 'success');
      renderApp();
    }

            <div><span class="text-slate-400">الباركود:</span> <b class="font-mono text-brand-700">${s.sample_id}</b></div>
            <div><span class="text-slate-400">المريض / النزيل:</span> <b>${s.patient_ref}</b></div>
            <div><span class="text-slate-400">القطاع:</span> <b>${s.target_sector || 'تجمع القصيم الصحي'}</b></div>
            <div><span class="text-slate-400">الفحص:</span> <b>${s.test_type}</b></div>
            <div class="col-span-2 text-[11px] text-slate-500 pt-1 border-t border-slate-200/60">
              المنفذ المستمع: <span class="font-mono font-bold text-emerald-700">${s.detected_port || 'RS-232 Serial COM3 (Auto-Ingest)'}</span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">التقرير السريري الصادر:</label>
            <div class="p-4 bg-emerald-50/60 text-slate-800 rounded-2xl font-sans text-xs leading-relaxed border border-emerald-200 whitespace-pre-line font-medium">
              ${s.result || 'لا توجد نتيجة مسجلة حتى الآن.'}
            </div>
          </div>

          <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-[11px]">
            <button onclick="window.print()" class="text-brand-600 hover:underline font-bold flex items-center gap-1">
              <i data-lucide="printer" class="w-3.5 h-3.5"></i> طباعة التقرير
            </button>
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">إغلاق</button>
          </div>
        </div>
      `);
    }

    function updateStatus(sampleId, newStatus, newLocation) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      s.status = newStatus;
      s.current_location = newLocation;
      db.saveSamples(samples);
      db.addLog(`STATUS_CHANGE >> Sample ${sampleId} status set to [${newStatus}].`);
      showToast(`تم تحديث حالة العينة (${sampleId})`, 'success');
      renderApp();
    }

    /* ==========================================================================
       7. GLOBAL ROUTER & NAV CONTROLLER
       ========================================================================== */

    function renderNavbar() {
      const user = db.getUser();
      const slot = document.getElementById('nav-user-slot');

      if (!user) {
        slot.innerHTML = `
          <button onclick="renderAuthView()" class="text-xs font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>تسجيل الدخول / حجز منشأة</span>
          </button>
        `;
      } else {
        slot.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <div class="text-xs font-bold text-slate-800">${user.name}</div>
              <div class="text-[11px] text-slate-400 leading-none">${user.facility_name}</div>
            </div>
            <div class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-brand-700 text-xs">
              ${user.name.charAt(0)}
            </div>
            <button onclick="logoutUser()" title="تسجيل الخروج" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderApp() {
      renderNavbar();
      const user = db.getUser();
      const root = document.getElementById('app-root');

      if (!user) {
        renderAuthView();
        renderLogs();
        return;
      }

      if (user.role === 'specialist') {
        root.innerHTML = renderSpecialistDashboard(user);
      } else {
        root.innerHTML = renderSenderDashboard(user);
      }

      renderLogs();
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      renderApp();
    });
  </script>
</body>
</html>
