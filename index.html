    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },

            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',

  <style>

    /* تنسيق العينات المكتملة */
    .completed-row {
      opacity: 0.5;
      filter: grayscale(80%);
      transition: all 0.3s ease;
    }
    .completed-row:hover {
      opacity: 1;
      filter: grayscale(0%);
    }

    function initDatabase() {
      const storedSamples = JSON.parse(localStorage.getItem('ln_samples') || '[]');
      const hasRehabSample = storedSamples.some(s => s.sender_facility === REHAB_NAME);

      if (!localStorage.getItem('ln_facilities') || !localStorage.getItem('ln_samples') || !hasRehabSample) {
        localStorage.setItem('ln_facilities', JSON.stringify(INITIAL_FACILITIES));
        localStorage.setItem('ln_samples', JSON.stringify(INITIAL_SAMPLES));
      }
      
      let currentReagents = JSON.parse(localStorage.getItem('ln_reagents') || '[]');
      const hasDr = currentReagents.some(r => r.id === 'dr0006_blood_panel');
      if (!currentReagents.length || !hasDr) {
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
      }

      if (!localStorage.getItem('ln_blood_inventory')) {
        localStorage.setItem('ln_blood_inventory', JSON.stringify(INITIAL_BLOOD_INVENTORY));
      }

      if (!localStorage.getItem('ln_logs')) {
        localStorage.setItem('ln_logs', JSON.stringify([
          `[${new Date().toLocaleTimeString('en-US')}] SYSTEM_BOOT >> LabNexus Ready. Multi-tenant Separation Activated.`

          facility_id: "fac-1",

      clearUser: () => localStorage.removeItem('ln_user'),

        logs.unshift(`[${new Date().toLocaleTimeString('en-US')}] ${msg}`);
        if (logs.length > 40) logs.pop();
        localStorage.setItem('ln_logs', JSON.stringify(logs));
        renderLogs();
      }
    };

      recordsDeptFilter = "All";
      recordsStatusFilter = "All";
      recordsSearchQuery = "";
      currentAppTab = "home"; 
      hospitalActiveTab = "specialist";
      renderApp();
      showToast(`مرحباً بك: ${userData.name}`, 'info');
    }

    function logoutUser() {
      db.addLog(`AUTH >> User logged out`);

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;
      box.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(contentHtml) {
      const modalCont = document.getElementById('modal-container');
      modalCont.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
          <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-200">
            ${contentHtml}
          </div>
        </div>
      `;
      modalCont.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      const modalCont = document.getElementById('modal-container');
      modalCont.classList.add('hidden');
      modalCont.innerHTML = '';
    }

    function renderLogs() {
      const c = document.getElementById('system-logs-container');
      if (!c) return;
      const logs = db.getLogs();
      c.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    }

    function clearSystemLogs() {
      localStorage.setItem('ln_logs', JSON.stringify([]));
      renderLogs();
    }

    function resetAllData() {
      if (confirm("هل أنت متأكد من رغبتك في تفريغ الذاكرة وإعادة الضبط التام؟")) {
        localStorage.clear();
        location.reload();
      }
    }

    function toggleReagent(reagentId) {
      const reagents = db.getReagents();
      const item = reagents.find(r => r.id === reagentId);
      if (!item) return;

      item.available = !item.available;
      db.saveReagents(reagents);

      if (!item.available) {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked OUT OF STOCK.`);
        showToast(`تم تحديد محلول (${item.name}) كـ "نافذ بالمستشفى". تم حظر إرساله فوراً!`, 'error');
      } else {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked AVAILABLE.`);
        showToast(`تم تحديث محلول (${item.name}) كـ "متوفر"`, 'success');
      }
      renderApp();
    }

    function notifyHealthCluster() {
      db.addLog("HEALTH_CLUSTER >> إرسال إخطار للتجمع الصحي حول النواقص المخبرية من المستشفى المركزي.");
      showToast("تم إرسال إخطار للتجمع الصحي بنفاذ العينات بنجاح!", "success");
    }

    function changeSampleState(sampleId, targetStatus) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      s.status = targetStatus;
      if (targetStatus === 'Received') {
        s.current_location = "مختبر الاستقبال - مستشفى بريدة";
      } else if (targetStatus === 'In-Testing') {
        s.current_location = "داخل القسم المختص (قيد الفحص والزرع)";
      } else if (targetStatus === 'Sent') {
        s.current_location = "في الطريق إلى المختبر";
      }

      db.saveSamples(samples);
      db.addLog(`STATUS_CHANGE >> ${sampleId} state updated to [${targetStatus}].`);
      showToast(`تم تعديل حالة العينة (${sampleId}) بنجاح إلى: ${STATUS_MAP[targetStatus].label}`, 'success');
      renderApp();
    }

    function switchAppTab(tab) {
      currentAppTab = tab;
      renderApp();
    }

    function getManualTestType(testType) {
      if(!testType) return null;
      const t = testType.toLowerCase();
      if (t.includes("زراعة") || t.includes("مزرعة") || t.includes("culture") || t.includes("worksheet")) return "culture_worksheet";
      if (t.includes("عمالة") || t.includes("وافدة") || t.includes("expatriate")) return "worker_microbiology";
      if (t.includes("منوي") || t.includes("semen")) return "semen";
      return null;
    }

    function openManualEntryModal(sampleId) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const manualType = s.manual_type || getManualTestType(s.test_type);
      if (manualType === "culture_worksheet") {
        renderCultureWorksheetForm(s);
      } else if (manualType === "worker_microbiology") {
        renderWorkerMicrobiologyForm(s);
      } else if (manualType === "semen") {
        renderSemenAnalysisForm(s);
      } else {
        showToast("هذا الفحص غير مرتبط باستمارة يدوية", "error");
      }
    }

    function handleSaveCultureWorksheet(e, sampleId) {
      e.preventDefault();
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const structured = {
        template: "culture_worksheet",
        specimen: document.getElementById('cw_specimen').value,
        collection_method: document.querySelector('input[name="cw_method"]:checked')?.value || 'Midstream',
        plate1: {
          name: document.getElementById('cw_p1_name').value,
          growth: document.querySelector('input[name="cw_p1_g"]:checked')?.value || 'Growth',
          count: document.getElementById('cw_p1_count').value,
          morph: document.getElementById('cw_p1_morph').value,
          color: document.getElementById('cw_p1_color').value
        },
        plate2: {
          name: document.getElementById('cw_p2_name').value,
          growth: document.querySelector('input[name="cw_p2_g"]:checked')?.value || 'Growth',
          count: document.getElementById('cw_p2_count').value,
          morph: document.getElementById('cw_p2_morph').value,
          color: document.getElementById('cw_p2_color').value
        },
        isolate1: {
          organism: document.getElementById('cw_iso1_org').value,
          key: document.getElementById('cw_iso1_key').value
        },
        final_organism: document.getElementById('cw_final_org').value,
        comments: document.getElementById('cw_final_com').value,
        reported_by: document.getElementById('cw_rep_by').value,
        checked_by: document.getElementById('cw_chk_by').value
      };

      s.status = "Completed";
      s.current_location = "تم الاعتماد من قسم الميكروبيولوجي - بريدة";
      s.structured_data = structured;
      s.result = `[URINE / STOOL CULTURE – WORKSHEET]
• Final Organism: ${structured.final_organism}
• Specimen: ${structured.specimen} (${structured.collection_method})
• Growth Observation: Plate 1 (${structured.plate1.name} - ${structured.plate1.count}) | Plate 2 (${structured.plate2.name} - ${structured.plate2.count})
• AST Sensitivity Summary: Sensitive to Ciprofloxacin, Nitrofurantoin, Ceftriaxone, Gentamicin. Resistant to Ampicillin & SXT.
• Comments: ${structured.comments}`;

      db.saveSamples(samples);
      db.addLog(`CULTURE_WORKSHEET >> Sample [${sampleId}] verified and recorded according to Urine/Stool worksheet standard.`);
      closeModal();
      showToast(`تم اعتماد وحفظ ورقة عمل المزرعة للعينة (${sampleId}) بنجاح!`, 'success');
      renderApp();
    }

    function handleSaveWorkerForm(e, sampleId) {
      e.preventDefault();
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const getRadioVal = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || 'negative';

      const structured = {
        template: "worker_microbiology",
        pregnancy: getRadioVal('w_preg'),
        glucose: getRadioVal('w_glu'),
        urine_parasites: getRadioVal('w_urine_par'),
        stool_parasites: getRadioVal('w_stool_par'),
        stool_culture: getRadioVal('w_cult'),
        throat_diptheria: getRadioVal('w_throat'),
        decision: getRadioVal('w_decision') === 'clear' ? 'خالية من الطفيليات والبكتيريا المعدية' : 'لإعادة الفحص بعد العلاج اللازم'
      };

      s.status = "Completed";
      s.current_location = "تم الاعتماد من قسم الطفيليات - بريدة";
      s.structured_data = structured;
      s.result = `[تقرير فحص العمالة الوافدة - مستشفى بريدة المركزي]
• Urine Pregnancy: ${structured.pregnancy.toUpperCase()}
• Urine Glucose: ${structured.glucose.toUpperCase()}

• Throat Diptheria: ${structured.throat_diptheria.toUpperCase()}

    function autoProcessIncomingBarcode(barcode) {
      const samples = db.getSamples();
      const target = samples.find(s => s.sample_id.trim().toUpperCase() === barcode.trim().toUpperCase());

      if (!target) return;
      if (target.status === 'Completed') return;

      target.status = "Completed";
      target.current_location = "تم الإنهاء بواسطة جهاز التحليل الآلي";
      target.result = generateRealClinicalResult(target.test_type, target.patient_ref);
      db.saveSamples(samples);

      db.addLog(`AUTO_MATCH >> Barcode [${barcode}] matched. Status moved to [تم الفحص].`);
      showToast(`تم الفحص: استلم النظام نتيجة العينة (${barcode}) وتم اعتمادها وتحديثها تلقائياً!`, 'success');
      renderApp();
    }

    async function backgroundDeviceListener() {
      try {
        const res = await fetch('http://localhost:5000/api/port-data');
        if (res.ok) {
          const data = await res.json();
          if (data.readings && data.readings.length > 0) {
            data.readings.forEach(item => {
              if (item.barcode) autoProcessIncomingBarcode(item.barcode);
            });
          }
        }
      } catch (e) {}
    }
    setInterval(backgroundDeviceListener, 2000);

      db.addLog(`RQEEM_SYNC >> Injected batch [${batchCode}] with 2 samples from Clinic.`);
      showToast(`تم استيراد حزمة (${batchCode}) من نظام رقيم بنجاح!`, 'success');
      renderApp();
    }

    /* ==========================================================================
       6. VIEW: RECORDS & FACILITY LOGS
       ========================================================================== */

    function renderRecordsView() {
      const user = db.getUser();
      if (!user) return '';

      const allSamples = db.getSamples();
      const allFacilities = db.getFacilities();

      const isSpecialist = user.role === 'specialist';

      const accessibleSamples = isSpecialist 
        ? allSamples 
        : allSamples.filter(s => s.sender_facility === user.facility_name);

      const accessibleFacilities = isSpecialist 
        ? allFacilities 
        : allFacilities.filter(f => f.name === user.facility_name);

      let filteredSamples = accessibleSamples.filter(s => {
        const query = (recordsSearchQuery || "").toLowerCase().trim();
        const matchesQuery = !query || 
          (s.sample_id && s.sample_id.toLowerCase().includes(query)) ||
          (s.patient_ref && s.patient_ref.toLowerCase().includes(query)) ||
          (s.test_type && s.test_type.toLowerCase().includes(query)) ||
          (s.sender_facility && s.sender_facility.toLowerCase().includes(query)) ||
          (s.department && s.department.toLowerCase().includes(query));

        const matchesFacility = !isSpecialist || recordsFacilityFilter === 'All' || s.sender_facility === recordsFacilityFilter || s.assigned_lab === recordsFacilityFilter;
        const matchesDept = recordsDeptFilter === 'All' || s.department === recordsDeptFilter;
        const matchesStatus = recordsStatusFilter === 'All' || s.status === recordsStatusFilter;

        return matchesQuery && matchesFacility && matchesDept && matchesStatus;

      return `
        <div class="space-y-6">

            <div>
              <div class="flex items-center gap-2">

                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isSpecialist ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${isSpecialist ? 'صلاحية الإدارة الشاملة' : 'سجلات منشأتك فقط'}
                </span>
              </div>
              <p class="text-xs text-slate-500 mt-1">
                ${isSpecialist 
                  ? 'عرض وإدارة شحنات العينات من كافة المراكز والمواقع المربوطة بمستشفى بريدة المركزي'
                  : 'تتبع السجلات والتحاليل الخاصة بمنشأتك مع حماية تامة لسرية بيانات المراكز الأخرى'}

            </div>
            
            <div class="text-xs font-bold text-slate-500 bg-slate-100 px-3.5 py-2 rounded-xl">
              السجلات المتاحة: <span class="text-brand-700 font-extrabold">${accessibleSamples.length}</span>
            </div>
          </div>

          <!-- Connected Sites Grid -->

            ${accessibleFacilities.map(fac => {
              const facSamples = accessibleSamples.filter(s => s.sender_facility === fac.name || s.assigned_lab === fac.name);
              const isRefLab = fac.name === PRIMARY_HOSPITAL_NAME;

              return `
                <div ${isSpecialist ? `onclick="setRecordFacilityFilter('${fac.name}')"` : ''} class="bg-white p-4 rounded-2xl border transition ${isSpecialist ? 'cursor-pointer hover:border-slate-300 shadow-xs' : 'cursor-default'} ${recordsFacilityFilter === fac.name && isSpecialist ? 'border-brand-500 ring-2 ring-brand-500/20 shadow-sm' : 'border-slate-200/80'}">

                  </div>
                  <h3 class="font-bold text-slate-900 text-xs mt-3">${fac.name}</h3>
                  <p class="text-[10px] text-slate-400 mt-0.5">${fac.type} - ${fac.city}</p>
                </div>

                  <input type="text" id="records-search-input" oninput="onRecordSearchChanged(this.value)" value="${recordsSearchQuery}" placeholder="ابحث برقم الباركود، اسم المريض، الفحص..." class="w-full pr-9 pl-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500">
                </div>
              </div>

              <!-- Filter by Facility/Site (فقط للمستشفى المركزي) -->
              ${isSpecialist ? `
                <div>
                  <label class="block font-bold text-slate-700 mb-1">الموقع / المنشأة</label>
                  <select onchange="onRecordFilterFacility(this.value)" class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 font-semibold text-slate-800">
                    <option value="All" ${recordsFacilityFilter === 'All' ? 'selected' : ''}>كافة المواقع</option>
                    ${allFacilities.map(f => `<option value="${f.name}" ${recordsFacilityFilter === f.name ? 'selected' : ''}>${f.name}</option>`).join('')}
                  </select>
                </div>
              ` : ''}

              <!-- Filter by Department -->
              <div>
                <label class="block font-bold text-slate-700 mb-1">القسم الداخلي</label>
                <select onchange="onRecordFilterDept(this.value)" class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 font-semibold text-slate-800">
                  <option value="All" ${recordsDeptFilter === 'All' ? 'selected' : ''}>كافة الأقسام</option>
                  ${LAB_DEPARTMENTS.map(d => `<option value="${d.id}" ${recordsDeptFilter === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                </select>
              </div>

            </div>

            <!-- Status Filter Pills -->
            <div class="flex items-center gap-2 pt-2 border-t border-slate-100 flex-wrap">
              <span class="text-[11px] font-bold text-slate-400">حالة العينة:</span>
              ${['All', 'Sent', 'Received', 'In-Testing', 'Completed'].map(st => {
                const label = st === 'All' ? 'الكل' : STATUS_MAP[st].label;
                const isAct = recordsStatusFilter === st;
                return `
                  <button onclick="onRecordFilterStatus('${st}')" class="px-3 py-1 rounded-xl text-xs font-bold transition ${isAct ? 'bg-brand-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">

                    const isDr = s.selected_tests && s.selected_tests.length > 0;

                      <tr class="hover:bg-slate-50/70 transition ${s.status === 'Completed' ? 'completed-row' : ''}">
                        <td class="p-4 font-black font-mono text-brand-700 text-sm">${s.sample_id}</td>
                        <td class="p-4 font-semibold text-slate-800">${s.patient_ref}</td>

                            <i data-lucide="arrow-left" class="w-2.5 h-2.5"></i>
                            <span>${s.assigned_lab}</span>
                          </div>
                        </td>
                        <td class="p-4">
                          <span class="px-2 py-0.5 bg-blue-50 text-blue-800 rounded font-bold text-[10px] block w-max">${s.department}</span>
                          <span class="font-bold text-slate-900 mt-1 block">${s.test_type}</span>
                          ${isDr ? `
                            <button onclick="viewDr0006Sheet('${s.sample_id}')" class="text-[10px] text-brand-600 font-bold hover:underline mt-0.5 block">
                              استمارة DR-0006 (${s.selected_tests.length} فحص)
                            </button>
                          ` : ''}
                        </td>
                        <td class="p-4">
                          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${STATUS_MAP[s.status]?.color || ''}">
                            ${STATUS_MAP[s.status]?.label || s.status}
                          </span>
                          <div class="text-[10px] text-slate-400 mt-1">${s.current_location}</div>
                        </td>
                        <td class="p-4 font-mono text-[11px] text-slate-500">${s.created_at}</td>
                        <td class="p-4 text-center">
                          ${s.status === 'Completed' ? `
                            <button onclick="showResultModal('${s.sample_id}')" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition inline-flex items-center gap-1 shadow-xs">
                              <i data-lucide="file-check-2" class="w-3.5 h-3.5"></i>
                              <span>عرض النتيجة</span>
                            </button>
                          ` : `
                            <span class="text-[10px] text-slate-400 bg-slate-100 px-2 py-1 rounded-md">تحت الإجراء</span>
                          `}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    function onRecordSearchChanged(val) {
      recordsSearchQuery = val;
      renderApp();
    }

    function onRecordFilterFacility(val) {
      recordsFacilityFilter = val;
      renderApp();
    }

    function setRecordFacilityFilter(facName) {
      recordsFacilityFilter = (recordsFacilityFilter === facName) ? 'All' : facName;
      renderApp();
    }

    function onRecordFilterDept(val) {
      recordsDeptFilter = val;
      renderApp();
    }

    function onRecordFilterStatus(val) {
      recordsStatusFilter = val;
      renderApp();
    }

    function resetRecordFilters() {
      recordsSearchQuery = "";
      recordsFacilityFilter = "All";
      recordsDeptFilter = "All";
      recordsStatusFilter = "All";
      renderApp();
    }

    /* ==========================================================================
       7. DASHBOARD: SPECIALIST (HOSPITAL TABS: MANAGER, DOCTOR, SPECIALIST)
       ========================================================================== */

      'Sent': { label: 'تم الإرسال', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      'Received': { label: 'استلمت بالمستشفى', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      'In-Testing': { label: 'قيد الفحص بالجهاز', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      'Completed': { label: 'تم الفحص (معتمد)', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
    };

    let currentSelectedDept = "All";

    function renderHospitalDashboard(user) {
      const allSamples = db.getSamples();
      const reagents = db.getReagents();

      let samples = allSamples;
      
      if (hospitalActiveTab === 'doctor') {
        // الطبيب لا يرى سوى عيناته التي طلبها
        samples = samples.filter(s => s.ordered_by === user.name);
      } else if (currentSelectedDept !== "All") {
        samples = samples.filter(s => s.department === currentSelectedDept);
      }
      
      // العينات المكتملة تنزل للأسفل
      samples.sort((a, b) => (a.status === 'Completed' ? 1 : -1));

      // الفلترة الديناميكية للكواشف بناء على القسم المختار
      let displayedReagents = reagents;
      if (currentSelectedDept !== "All") {
        displayedReagents = reagents.filter(r => r.dept === currentSelectedDept);
      }

            <div class="flex flex-col items-end gap-2">
              <span class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                مستمع الأجهزة الآلية نشط
              </span>
              ${(hospitalActiveTab === 'manager' || hospitalActiveTab === 'specialist') ? `
                <button onclick="notifyHealthCluster()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1.5 transition">

                </button>

          </div>

          ${hospitalActiveTab === 'doctor' ? `
            <div class="flex items-center gap-3 mt-2 mb-2">
              <button onclick="openNewSampleModal()" class="bg-brand-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4 inline"></i> طلب تحليل مخبري (أمر طبي)</button>

            </div>

                كافة الأقسام (${allSamples.length})
              </button>
              ${LAB_DEPARTMENTS.map(d => `
                <button onclick="filterByDept('${d.id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${currentSelectedDept === d.id ? 'bg-brand-600 text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">

                  </button>

              </div>
            </div>

              <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between">
                <div>

                  <p class="text-2xl font-black text-amber-600 mt-1">${kpiSent}</p>

                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="truck" class="w-5 h-5"></i></div>

              <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between">

                  <p class="text-xs font-semibold text-slate-500">استلمت بالمستشفى</p>

                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="inbox" class="w-5 h-5"></i></div>

    function approveBloodRequest(sampleId) {
      const samples = db.getSamples();
      const s = samples.find(x => x.sample_id === sampleId);
      if(s) {
        s.status = 'Completed';
        s.current_location = 'تم صرف الوحدة للمريض';
        db.saveSamples(samples);
        db.addLog(`HEMATOS >> Blood request ${sampleId} approved and unit dispatched.`);
        showToast("تم اعتماد طلب الدم وصرف الكيس للعيادة", "success");
        renderApp();
      }
    }

    function updateTestTypes(dept) {
      const select = document.getElementById('new-test-type');
      if(!dept) {
        select.innerHTML = '<option value="">-- يرجى اختيار القسم أولاً --</option>';
        return;
      }
      const reagents = db.getReagents().filter(r => r.dept === dept);
      select.innerHTML = '<option value="">-- اضغط لاختيار الفحص --</option>' +
          reagents.map(r => `<option value="${r.name}" ${!r.available ? 'disabled' : ''}>${r.name} ${r.is_manual ? '🔬 [يدوي]' : ''} ${!r.available ? '✖ (نافذ)' : '✓'}</option>`).join('');
      
      // إخفاء استمارة DR إذا تم تغيير القسم
      const drContainer = document.getElementById('dr0006-checklist-container');
      if (drContainer) drContainer.classList.add('hidden');
    }

    function onTestTypeChanged(testName) {
      const isDr = testName.includes("DR-0006") || testName.includes("تحاليل دم");
      const drContainer = document.getElementById('dr0006-checklist-container');
      if (drContainer) {
        if (isDr) drContainer.classList.remove('hidden');
        else drContainer.classList.add('hidden');
      }
      checkReagentAvailability(testName);
    }

    function checkReagentAvailability(testName) {
      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testName);
      const banner = document.getElementById('reagent-blocked-banner');
      const submitBtn = document.getElementById('btn-submit-sample');
      
      if (r) {
        if (!r.available) {
          banner.classList.remove('hidden');
          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
          return;
        }
      }

      banner.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
      lucide.createIcons();
    }

    function handleBloodRequest(e) {
      e.preventDefault();
      const newSample = {
        sample_id: document.getElementById('bld-req-id').value,
        patient_ref: document.getElementById('bld-pat').value,
        department: "BloodBank",
        test_type: document.getElementById('bld-product').value,
        sender_facility: db.getUser().facility_name,
        assigned_lab: BLOOD_BANK_NAME,
        current_location: "بانتظار موافقة بنك الدم",
        status: "Sent",
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: `العيادة: ${document.getElementById('bld-clinic').value} | الأولوية: ${document.getElementById('bld-priority').value}`,
        ordered_by: db.getUser().name
      };
      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);
      closeModal();
      renderApp();
      showToast("تم تحويل الطلب لبنك الدم", "success");

    function handleCreateSample(e) {
      e.preventDefault();
      const user = db.getUser();
      const smpId = document.getElementById('new-smp-id').value.trim();
      const patRef = document.getElementById('new-pat-ref').value.trim();
      const dept = document.getElementById('new-dept-select').value;
      const testType = document.getElementById('new-test-type').value;
      const notes = document.getElementById('new-notes').value.trim();

      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testType);
      if (r && !r.available) {
        alert("لا يمكن إرسال العينة؛ المحلول نافذ حالياً بالمستشفى!");
        return;
      }

      let selectedTests = [];
      if (testType.includes("DR-0006") || testType.includes("تحاليل دم")) {
        document.querySelectorAll('input[name="dr_test_box"]:checked').forEach(cb => {
          selectedTests.push(cb.value);
        });
      }

      const fileInput = document.getElementById('new-file');
      const attachmentName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : (selectedTests.length ? "استمارة_إحالة_DR0006.pdf" : "مستند_إحالة_طبي.pdf");
      const manualType = getManualTestType(testType);

      const isDoctorOrdering = user.role === 'specialist' && hospitalActiveTab === 'doctor';

      const newSample = {
        sample_id: smpId,
        patient_ref: patRef,
        department: dept,
        test_type: testType,
        is_manual: Boolean(manualType),
        manual_type: manualType,
        selected_tests: selectedTests,
        sender_facility: user.facility_name,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: isDoctorOrdering ? "تم الطلب من العيادة الداخلية" : "في الطريق إلى مستشفى بريدة المركزي",
        status: isDoctorOrdering ? "Received" : "Sent",
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: notes || (selectedTests.length ? `تم اختيار ${selectedTests.length} فحص من استمارة DR-0006` : ''),
        attachment_name: attachmentName,
        result: null,
        structured_data: null,
        ordered_by: user.name
      };

      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);

      db.addLog(`ORDER_PLACED >> Barcode ${smpId} (${testType}) routed to [${dept}].`);
      closeModal();
      showToast(`تم إرسال العينة (${smpId}) بنجاح إلى قسم (${dept})!`, 'success');
      renderApp();
    }

      lucide.createIcons();
    }

    function renderNavbar() {
      const user = db.getUser();
      const slot = document.getElementById('nav-user-slot');

      const btnSpec = document.getElementById('nav-btn-spec');
      const btnBlood = document.getElementById('nav-btn-blood');
      const btnRehab = document.getElementById('nav-btn-rehab');
      const btnPrison = document.getElementById('nav-btn-prison');
      const btnClinic = document.getElementById('nav-btn-clinic');

      const resetBtns = () => {
        if (btnSpec) btnSpec.className = "px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900";
        if (btnBlood) btnBlood.className = "px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900";
        if (btnRehab) btnRehab.className = "px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900";
        if (btnPrison) btnPrison.className = "px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900";
        if (btnClinic) btnClinic.className = "px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900";
      };

      resetBtns();

      if (user) {
        if (user.role === 'specialist' && btnSpec) {
          btnSpec.className = "px-3 py-1.5 rounded-xl transition bg-white text-brand-700 shadow-xs";
        } else if (user.role === 'blood_bank' && btnBlood) {
          btnBlood.className = "px-3 py-1.5 rounded-xl transition bg-white text-brand-700 shadow-xs";
        } else if (user.facility_name.includes("التأهيل") && btnRehab) {
          btnRehab.className = "px-3 py-1.5 rounded-xl transition bg-white text-brand-700 shadow-xs";
        } else if (user.facility_name.includes("سجن") && btnPrison) {
          btnPrison.className = "px-3 py-1.5 rounded-xl transition bg-white text-brand-700 shadow-xs";
        } else if (btnClinic) {
          btnClinic.className = "px-3 py-1.5 rounded-xl transition bg-white text-brand-700 shadow-xs";
        }
      }

      if (!user) {
        slot.innerHTML = `
          <button onclick="renderAuthView()" class="text-xs font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>تسجيل الدخول / حجز منشأة</span>
          </button>
        `;
      } else {
        slot.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <div class="text-xs font-bold text-slate-800">${user.name}</div>
              <div class="text-[11px] text-slate-400 leading-none">${user.facility_name}</div>
            </div>
            <div class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-brand-700 text-xs">
              ${user.name.charAt(0)}
            </div>
            <button onclick="logoutUser()" title="تسجيل الخروج" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderApp() {
      renderNavbar();
      const user = db.getUser();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!user) {
        renderAuthView();
        renderLogs();
        return;
      }

      const isSpecialist = user.role === 'specialist';
      const userAccessibleCount = isSpecialist 
        ? db.getSamples().length 
        : db.getSamples().filter(s => s.sender_facility === user.facility_name).length;

      const badge = document.getElementById('sidebar-sample-badge');
      if (badge) badge.innerText = userAccessibleCount;

      const recLabel = document.getElementById('sidebar-records-label');
      if (recLabel) {
        recLabel.innerText = isSpecialist ? "السجلات ومواقع العينات" : "سجلات وعينات المركز";
      }

      // تحديث أزرار الشريط الجانبي
      const btnHome = document.getElementById('tab-btn-home');
      const btnRecords = document.getElementById('tab-btn-records');
      if (btnHome && btnRecords) {
        if (currentAppTab === 'home') {
          btnHome.className = "w-full flex items-center justify-between p-3 rounded-2xl font-bold text-xs transition bg-brand-50 text-brand-700";
          btnRecords.className = "w-full flex items-center justify-between p-3 rounded-2xl font-bold text-xs transition text-slate-600 hover:bg-slate-50";
        } else {
          btnHome.className = "w-full flex items-center justify-between p-3 rounded-2xl font-bold text-xs transition text-slate-600 hover:bg-slate-50";
          btnRecords.className = "w-full flex items-center justify-between p-3 rounded-2xl font-bold text-xs transition bg-brand-50 text-brand-700";
        }
      }

      if (currentAppTab === 'records') {
        root.innerHTML = renderRecordsView();
      } else {
        if (isSpecialist) {
          root.innerHTML = renderHospitalDashboard(user);
        } else if (user.role === 'blood_bank') {
          root.innerHTML = renderBloodBankDashboard(user);
        } else {
          root.innerHTML = renderSenderDashboard(user);
        }
      }

      renderLogs();
      lucide.createIcons();
    }

      if (type === 'specialist') {

          role: "sender",
          facility_id: "fac-2",
          facility_name: REHAB_NAME
        });
      } else if (type === 'prison_sender') {
        loginUser({
          id: "usr-prison",
          name: "رائد طبيب / خالد المطيري",
          email: "prison.med@labnexus.sa",
          role: "sender",
          facility_id: "fac-3",
          facility_name: PRISON_NAME
        });
      } else if (type === 'clinic_sender') {
        loginUser({
          id: "usr-clinic",
          name: "د. فهد المشيقح",

        });
      } else if (type === 'blood_bank') {
        loginUser({
          id: "usr-blood",

          email: "blood.bank@labnexus.sa",

          facility_name: BLOOD_BANK_NAME

    }

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      renderApp();
    });
  </script>
</body>
