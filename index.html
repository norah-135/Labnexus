        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "مختبر الاستقبال - مستشفى بريدة",
        status: "Received",
        created_at: "2026-09-07 10:45",

    function initDatabase() {
      if (!localStorage.getItem('ln_facilities')) {
        localStorage.setItem('ln_facilities', JSON.stringify(INITIAL_FACILITIES));
      }
      if (!localStorage.getItem('ln_samples')) {
        localStorage.setItem('ln_samples', JSON.stringify(INITIAL_SAMPLES));
      }
      if (!localStorage.getItem('ln_reagents')) {
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
      }
      if (!localStorage.getItem('ln_logs')) {
        localStorage.setItem('ln_logs', JSON.stringify([
          `[${new Date().toLocaleTimeString('en-US')}] SYSTEM_READY >> Background listener active. Ready to auto-match analyzer results.`
        ]));
      }
      if (!localStorage.getItem('ln_user')) {
        loginUser({
          id: "usr-spec",
          name: "أخصائي / صالح الحربي",
          email: "lab.buraydah@labnexus.sa",
          role: "specialist",
          facility_id: "fac-1",
          facility_name: PRIMARY_HOSPITAL_NAME
        });
      }
    }

    const db = {
      getFacilities: () => JSON.parse(localStorage.getItem('ln_facilities') || '[]'),
      saveFacilities: (data) => localStorage.setItem('ln_facilities', JSON.stringify(data)),
      getSamples: () => JSON.parse(localStorage.getItem('ln_samples') || '[]'),
      saveSamples: (data) => localStorage.setItem('ln_samples', JSON.stringify(data)),
      getReagents: () => JSON.parse(localStorage.getItem('ln_reagents') || '[]'),
      saveReagents: (data) => localStorage.setItem('ln_reagents', JSON.stringify(data)),
      getUser: () => JSON.parse(localStorage.getItem('ln_user') || 'null'),
      setUser: (user) => localStorage.setItem('ln_user', JSON.stringify(user)),
      clearUser: () => localStorage.removeItem('ln_user'),
      getLogs: () => JSON.parse(localStorage.getItem('ln_logs') || '[]'),
      addLog: (msg) => {
        const logs = JSON.parse(localStorage.getItem('ln_logs') || '[]');
        logs.unshift(`[${new Date().toLocaleTimeString('en-US')}] ${msg}`);
        if (logs.length > 40) logs.pop();
        localStorage.setItem('ln_logs', JSON.stringify(logs));
        renderLogs();
      }
    };

    function loginUser(userData) {
      db.setUser(userData);
      db.addLog(`AUTH >> Logged in: ${userData.name} (${userData.facility_name})`);
      renderApp();
      showToast(`مرحباً بك: ${userData.name}`, 'info');
    }

    function logoutUser() {
      db.addLog(`AUTH >> User logged out`);
      db.clearUser();
      renderApp();
      showToast('تم تسجيل الخروج بنجاح', 'info');
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-box');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;
      box.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(contentHtml) {
      const modalCont = document.getElementById('modal-container');
      modalCont.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
          <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-200">
            ${contentHtml}
          </div>
        </div>
      `;
      modalCont.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      const modalCont = document.getElementById('modal-container');
      modalCont.classList.add('hidden');
      modalCont.innerHTML = '';
    }

    function renderLogs() {
      const c = document.getElementById('system-logs-container');
      if (!c) return;
      const logs = db.getLogs();
      c.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    }

    function clearSystemLogs() {
      localStorage.setItem('ln_logs', JSON.stringify([]));
      renderLogs();
    }

    function resetAllData() {
      if (confirm("هل أنت متأكد من رغبتك في تفريغ الذاكرة بالكامل والبدء من جديد؟")) {
        localStorage.clear();
        location.reload();
      }
    }

    /* ==========================================================================
       2. REAGENTS CONTROLS (تحكم توفر المحاليل والكواشف)
       ========================================================================== */

    function toggleReagent(reagentId) {
      const reagents = db.getReagents();
      const item = reagents.find(r => r.id === reagentId);
      if (!item) return;

      item.available = !item.available;
      db.saveReagents(reagents);

      if (!item.available) {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked OUT OF STOCK.`);
        showToast(`تم تحديد محلول (${item.name}) كـ "نافذ بالمستشفى". تم حظر إرساله فوراً!`, 'error');
      } else {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked AVAILABLE.`);
        showToast(`تم تحديث محلول (${item.name}) كـ "متوفر"`, 'success');
      }
      renderApp();
    }

    /* ==========================================================================
       3. ALWAYS-ON LISTENER & REAL CLINICAL RESULT INGESTION
       (استماع تلقائي دائم في الخلفية + مطابقة الباركود + نتيجة سريرية واقعية)
       ========================================================================== */

    function generateRealClinicalResult(testType, patientRef) {
      const t = testType.toLowerCase();
      const timeStr = new Date().toLocaleTimeString('ar-SA');

      if (t.includes("دم") || t.includes("cbc")) {
        return `[تقرير تحليل الدم الشامل CBC - معتمد]
• خضاب الدم (Hemoglobin): 14.6 g/dL (المعدل الطبيعي: 13.5 - 17.5)
• كريات الدم البيضاء (WBC): 6.2 x10^3/uL (المعدل الطبيعي: 4.5 - 11.0)
• الصفائح الدموية (Platelets): 238 x10^3/uL (المعدل الطبيعي: 150 - 450)
• خلايا الدم الحمراء (RBC): 4.8 x10^6/uL (المعدل الطبيعي: 4.3 - 5.9)
النتيجة: الفحص طبيعي وسليم وخالٍ من مؤشرات فقر الدم أو الالتهاب.
وقت التحليل: ${timeStr} | الجهاز: Sysmex XN Automated Analyzer`;
      } 
      else if (t.includes("سموم") || t.includes("toxicology")) {
        return `[تقرير فحص السموم والمؤثرات العقلية - قطاع السجون]
• مشتقات الأفيونات (Opiates): سلبية (Negative)
• الأمفيتامين والشبو: سلبية (Negative)
• الحشيش والقنب (THC): سلبية (Negative)
• المهدئات (Benzodiazepines): سلبية (Negative)
النتيجة النهائية: العينة سلبية وسليمة لكافة المواد الخاضعة للرقابة.
تمت المعايرة والمطابقة المخبرية آلياً بواسطة Cobas Analyzer.`;
      } 
      else if (t.includes("كبد") || t.includes("كلى") || t.includes("lft")) {
        return `[تقرير وظائف الأعضاء وكيمياء الدم]
• الكرياتينين: 0.9 mg/dL (المعدل الطبيعي: 0.7 - 1.3)
• نيتروجين اليوريا: 13 mg/dL (المعدل الطبيعي: 7 - 20)
• إنزيم الكبد (ALT): 21 U/L (المعدل الطبيعي: 7 - 56)
• إنزيم الكبد (AST): 18 U/L (المعدل الطبيعي: 10 - 40)
النتيجة: المؤشرات الحيوية للكبد والكلى سليمة وضمن النطاقات المرجعية.`;
      }
      else if (t.includes("بوتاسيوم") || t.includes("potassium")) {
        return `[فحص شوارد الدم - إلكترولايت]
• البوتاسيوم (K+): 4.1 mmol/L (المعدل الطبيعي: 3.5 - 5.1)
النتيجة: النسبة متوازنة وطبيعية تماماً.`;
      }
      else {
        return `[تقرير مخبري معتمد]
تم الفحص بواسطة جهاز التحليل الآلي بنجاح.
النتيجة: كافة المؤشرات الحيوية طبيعية ومطابقة للمعايير المعتمدة.`;
      }
    }

    // دالة المعالجة التلقائية بمجرد التقاط باركود العينة
    function autoProcessIncomingBarcode(barcode) {
      const samples = db.getSamples();
      const target = samples.find(s => s.sample_id.trim().toUpperCase() === barcode.trim().toUpperCase());

      if (!target) {
        db.addLog(`ANALYZER_SCAN >> Received barcode [${barcode}] but no matching order found.`);
        return;
      }

      // إذا كانت العينة مكتملة مسبقاً لا حاجة لإعادة المعالجة
      if (target.status === 'Completed') return;

      // تحديث فوري للحالة إلى "تم الفحص" وإدراج النتيجة الطبية الحقيقية
      target.status = "Completed";
      target.current_location = "تم الإنهاء بواسطة جهاز التحليل الآلي";
      target.result = generateRealClinicalResult(target.test_type, target.patient_ref);
      db.saveSamples(samples);

      db.addLog(`AUTO_MATCH >> Barcode [${barcode}] matched with ${target.patient_ref}. Status moved to [تم الفحص].`);
      showToast(`تم الفحص: استلم النظام نتيجة العينة (${barcode}) وتم اعتمادها وتحديثها تلقائياً!`, 'success');
      renderApp();
    }

    // استماع دائم وتلقائي في الخلفية بدون أي أزرار (Background Polling)
    async function backgroundDeviceListener() {
      try {
        const res = await fetch('http://localhost:5000/api/port-data');
        if (res.ok) {
          const data = await res.json();
          if (data.readings && data.readings.length > 0) {
            data.readings.forEach(item => {
              if (item.barcode) {
                autoProcessIncomingBarcode(item.barcode);
              }
            });
          }
        }
      } catch (e) {
        // الاستماع مستمر في الخلفية بهدوء
      }
    }
    setInterval(backgroundDeviceListener, 2000);

    function switchAuthTab(tab) {
      currentAuthTab = tab;
      renderAuthView();
    }

    function toggleSelfRegister() {
      isSelfRegisterMode = !isSelfRegisterMode;
      renderAuthView();
    }

    function onPreseededFacilityChange() {
      const select = document.getElementById('claim-facility-select');
      const banner = document.getElementById('claimed-alert-banner');
      const ownerSpan = document.getElementById('claimed-owner-text');
      const inputsContainer = document.getElementById('claim-inputs-container');
      const submitBtn = document.getElementById('btn-submit-claim');

      const fac = db.getFacilities().find(f => f.id === select.value);

      if (fac && fac.isClaimed) {
        banner.classList.remove('hidden');
        ownerSpan.textContent = fac.owner || 'مسؤول معتمد';
        inputsContainer.classList.add('opacity-40', 'pointer-events-none');
        submitBtn.disabled = true;
      } else {
        banner.classList.add('hidden');
        inputsContainer.classList.remove('opacity-40', 'pointer-events-none');
        if (submitBtn) submitBtn.disabled = false;
      }
      lucide.createIcons();
    }

    function handleClaimPreseeded(e) {
      e.preventDefault();
      const facId = document.getElementById('claim-facility-select').value;
      const userName = document.getElementById('claim-user-name').value.trim();
      const userEmail = document.getElementById('claim-user-email').value.trim();

      const facilities = db.getFacilities();
      const fac = facilities.find(f => f.id === facId);
      if (!fac || fac.isClaimed) return;

      fac.isClaimed = true;
      fac.owner = userName;
      db.saveFacilities(facilities);

      const userRole = (fac.type === 'Reference Lab' || fac.type.includes('مستشفى')) ? 'specialist' : 'sender';
      loginUser({
        id: "usr-" + Date.now(),
        name: userName,
        email: userEmail,
        role: userRole,
        facility_id: facId,
        facility_name: fac.name
      });
    }

    function handleSelfRegister(e) {
      e.preventDefault();
      const facName = document.getElementById('self-fac-name').value.trim();
      const sector = document.getElementById('self-fac-sector').value;
      const city = document.getElementById('self-fac-city').value.trim();
      const userName = document.getElementById('self-user-name').value.trim();
      const userEmail = document.getElementById('self-user-email').value.trim();

      const newId = "fac-" + Date.now();
      const isLab = sector.includes('مستشفى');
      const newFacility = {
        id: newId,
        name: facName,
        type: sector,
        city: city,
        isClaimed: true,
        owner: userName
      };

      const facilities = db.getFacilities();
      facilities.push(newFacility);
      db.saveFacilities(facilities);

      const userRole = isLab ? 'specialist' : 'sender';
      loginUser({
        id: "usr-" + Date.now(),
        name: userName,
        email: userEmail,
        role: userRole,
        facility_id: newId,
        facility_name: facName
      });
    }

    function handleRegularLogin(e) {
      e.preventDefault();
      demoLogin('specialist');
    }

    function demoLogin(type) {
      if (type === 'specialist') {
        loginUser({
          id: "usr-spec",
          name: "أخصائي / صالح الحربي",
          email: "lab.buraydah@labnexus.sa",
          role: "specialist",
          facility_id: "fac-1",
          facility_name: PRIMARY_HOSPITAL_NAME
        });
      } else if (type === 'prison_sender') {
        loginUser({
          id: "usr-prison",
          name: "رائد طبيب / خالد المطيري",
          email: "prison.med@labnexus.sa",
          role: "sender",
          facility_id: "fac-2",
          facility_name: PRISON_NAME
        });
      } else if (type === 'clinic_sender') {
        loginUser({
          id: "usr-clinic",
          name: "د. فهد المشيقح",

          role: "sender",

              ${reagents.map(r => `

                }">

       ========================================================================== */

    function renderSenderDashboard(user) {
      const samples = db.getSamples().filter(s => s.sender_facility === user.facility_name);
      const isPrison = user.facility_name.includes("سجن");

      return `
        <div class="space-y-6">

          <!-- Sender Header -->
          <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-xl font-black text-slate-900">${user.facility_name}</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isPrison ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${isPrison ? 'قطاع السجون والإصلاحيات' : 'مستوصف / مركز صحي'}
                </span>
              </div>
              <p class="text-xs text-slate-500 mt-1">
                المسؤول: <span class="font-bold text-slate-700">${user.name}</span> | توجيه العينات حسب قسم المختبر، وإرفاق التقارير الطبية المحمية
              </p>
            </div>

            <button onclick="openNewSampleModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-md shadow-brand-500/20">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>+ تسجيل وإرسال عينة جديدة</span>
            </button>
          </div>

          <!-- Samples List -->
          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
              <div>
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                  <i data-lucide="route" class="w-4 h-4 text-brand-600"></i>
                  <span>شحنات العينات الصادرة والتتبع المباشر</span>
                </h2>
                <p class="text-xs text-slate-400 mt-0.5">تتحدث النتيجة وتتحول الحالة إلى "تم الفحص" تلقائياً فور قراءة الجهاز للباركود</p>
              </div>
              <span class="text-xs text-slate-500 font-bold">العينات: ${samples.length}</span>
            </div>

            <div class="divide-y divide-slate-100">
              ${samples.length === 0 ? `
                <div class="p-12 text-center text-slate-400">لا توجد عينات مسجلة حالياً لهذه الجهة. اضغط بالأعلى لإرسال عينة جديدة.</div>
              ` : samples.map(s => {
                const curStep = s.status === 'Sent' ? 1 : s.status === 'Received' ? 2 : s.status === 'In-Testing' ? 3 : 4;
                const steps = ["تم الإرسال", "استلام بالمستشفى", "قيد الفحص بالجهاز", "تم الفحص"];

                return `
                  <div class="p-6 hover:bg-slate-50/50 transition space-y-4">
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                      <div class="space-y-1.5">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-black text-sm font-mono text-brand-700 bg-brand-50 px-2 py-0.5 rounded border border-brand-100">${s.sample_id}</span>
                          <span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded font-bold">${s.patient_ref}</span>
                          <span class="text-[10px] bg-blue-50 text-blue-800 px-2 py-0.5 rounded font-semibold">قسم: ${s.department}</span>
                          <span class="text-xs text-slate-400">${s.created_at}</span>
                        </div>
                        <div class="text-xs text-slate-700">
                          <span class="font-bold text-slate-900">الفحص المطلوب:</span> ${s.test_type} | 
                          <span class="font-bold text-slate-900">المستشفى المستقبل:</span> ${s.assigned_lab}
                        </div>

                        ${s.notes ? `
                          <div class="text-xs text-slate-600 bg-amber-50/60 border border-amber-200/60 p-2.5 rounded-xl max-w-xl">
                            <span class="font-bold text-amber-900">الملاحظات المدونة:</span> ${s.notes}
                          </div>
                        ` : ''}

                        ${s.attachment_name ? `
                          <div class="pt-1">
                            <button onclick="previewFile('${s.attachment_name}', '${s.sample_id}')" class="text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-lg border border-blue-200 inline-flex items-center gap-1.5 transition">
                              <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
                              <span>المستند المرفق: ${s.attachment_name} (مقفل ومحمي)</span>
                            </button>
                          </div>
                        ` : ''}
                      </div>

                      <div>
                        ${s.status === 'Completed' ? `
                          <button onclick="showResultModal('${s.sample_id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm shadow-emerald-600/20">
                            <i data-lucide="file-check-2" class="w-4 h-4"></i>
                            <span>عرض النتيجة المخبرية المعتمدة</span>
                          </button>
                        ` : `
                          <span class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg inline-flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                            ${s.current_location}
                          </span>
                        `}
                      </div>
                    </div>

                    <!-- Progress Stepper -->
                    <div class="pt-2">
                      <div class="grid grid-cols-4 gap-2">
                        ${steps.map((label, idx) => {
                          const stepNum = idx + 1;
                          const isDone = curStep >= stepNum;
                          return `
                            <div class="flex flex-col items-center text-center">
                              <div class="w-full h-1.5 rounded-full ${isDone ? 'bg-brand-600' : 'bg-slate-200'} mb-2"></div>
                              <span class="text-[11px] font-bold ${isDone ? 'text-slate-800' : 'text-slate-400'}">${label}</span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       MODAL: SEND NEW SAMPLE (مع اختيار القسم المخبري وحظر المحلول النافذ)
       -------------------------------------------------------------------------- */
    function openNewSampleModal() {
      const user = db.getUser();
      const randomCode = 'SMP-BRY-' + Math.floor(1000 + Math.random() * 9000);
      const reagents = db.getReagents();

      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
              <h3 class="font-extrabold text-slate-900 text-sm">تسجيل وإرسال عينة جديدة</h3>
              <p class="text-[11px] text-slate-400">الجهة المرسلة: ${user.facility_name}</p>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <form onsubmit="handleCreateSample(event)" class="space-y-3.5 text-xs">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">باركود العينة</label>
                <input id="new-smp-id" type="text" value="${randomCode}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold font-mono text-brand-700">
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">معرف النزيل أو المريض</label>
                <input id="new-pat-ref" type="text" placeholder="مثال: نزيل - 7810" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500">
              </div>
            </div>

            <!-- قسم المختبر المستهدف -->
            <div>
              <label class="block font-bold text-slate-700 mb-1">قسم المختبر المختص بالتحليل (Department)</label>
              <select id="new-dept-select" required class="w-full px-3 py-2 border border-slate-200 rounded-xl font-bold text-slate-800 bg-white">
                ${LAB_DEPARTMENTS.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
              </select>
            </div>

            <!-- قائمة الفحوصات مع فحص المحلول النافذ -->
            <div>
              <label class="block font-bold text-slate-700 mb-1">نوع الفحص المطلوب</label>
              <select id="new-test-type" onchange="checkReagentAvailability(this.value)" required class="w-full px-3 py-2 border border-slate-200 rounded-xl font-bold text-slate-800">
                <option value="">-- اضغط لاختيار الفحص --</option>
                ${reagents.map(r => `
                  <option value="${r.name}" data-dept="${r.dept}">
                    ${r.name} (${r.dept}) ${!r.available ? '✖ (نافذ بالمستشفى - غير متاح)' : '✓ (متوفر)'}
                  </option>
                `).join('')}
              </select>
            </div>

            <!-- تنبيه المنع الفوري عند اختيار محلول نافذ -->
            <div id="reagent-blocked-banner" class="hidden p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-rose-900 text-xs flex items-start gap-2.5">
              <i data-lucide="alert-octagon" class="w-5 h-5 text-rose-600 shrink-0 mt-0.5"></i>
              <div>
                <p class="font-extrabold text-rose-950">تنبيه: لا يمكن إرسال هذه العينة!</p>
                <p class="text-[11px] text-rose-800 mt-0.5 leading-relaxed">
                  محلول هذا التحليل نافذ حالياً بمستشفى بريدة المركزي. يرجى اختيار فحص آخر متاح أو التنسيق مع إدارة المختبر.
                </p>
              </div>
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">المستشفى المرجعي المستقبل</label>
              <input type="text" value="${PRIMARY_HOSPITAL_NAME}" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-slate-700 font-bold cursor-not-allowed">
            </div>

            <!-- Notes Section -->
            <div>
              <label class="block font-bold text-slate-700 mb-1">
                <i data-lucide="message-square-text" class="w-3.5 h-3.5 inline-block text-brand-600 ml-1"></i>
                ملاحظات سريرية (كتابة نصية)
              </label>
              <textarea id="new-notes" rows="2" placeholder="اكتب هنا أي تفاصيل طبية خاصة بالحالة..." class="w-full p-2.5 border border-slate-200 rounded-xl"></textarea>
            </div>

            <!-- Protected File Upload -->
            <div>
              <label class="block font-bold text-slate-700 mb-1">
                <i data-lucide="paperclip" class="w-3.5 h-3.5 inline-block text-brand-600 ml-1"></i>
                إرفاق تقرير طبي (PDF أو صورة - يتم قفله رقمياً مع العينة)
              </label>
              <div class="border-2 border-dashed border-slate-200 rounded-xl p-3 text-center hover:bg-slate-50 transition cursor-pointer relative">
                <input type="file" id="new-file" onchange="updateFileLabel(this)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                <div class="space-y-1">
                  <i data-lucide="upload-cloud" class="w-5 h-5 mx-auto text-slate-400"></i>
                  <p class="text-[11px] text-slate-600 font-semibold" id="file-label-text">اضغط لاختيار التقرير الطبي المرفق</p>
                  <p class="text-[9px] text-slate-400">لن يُسمح بأي تعديل أو مرفقات إضافية بعد الإرسال</p>
                </div>
              </div>
            </div>

            <div class="pt-2 flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">إلغاء</button>
              <button type="submit" id="btn-submit-sample" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md flex items-center gap-1.5">
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>تأكيد الإرسال للقسم المختص</span>
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function checkReagentAvailability(testName) {
      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testName);
      const banner = document.getElementById('reagent-blocked-banner');
      const submitBtn = document.getElementById('btn-submit-sample');
      const deptSelect = document.getElementById('new-dept-select');

      if (r) {
        // مطابقة القسم تلقائياً مع الفحص
        if (deptSelect && r.dept) {
          deptSelect.value = r.dept;
        }

        if (!r.available) {
          banner.classList.remove('hidden');
          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
          return;
        }
      }

      banner.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
      lucide.createIcons();
    }

    function updateFileLabel(input) {
      const lbl = document.getElementById('file-label-text');
      if (input.files && input.files[0]) {
        lbl.innerHTML = `<span class="text-brand-700 font-bold">تم اختيار: ${input.files[0].name}</span>`;
      }
    }

    function handleCreateSample(e) {
      e.preventDefault();
      const user = db.getUser();
      const smpId = document.getElementById('new-smp-id').value.trim();
      const patRef = document.getElementById('new-pat-ref').value.trim();
      const dept = document.getElementById('new-dept-select').value;
      const testType = document.getElementById('new-test-type').value;
      const notes = document.getElementById('new-notes').value.trim();

      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testType);
      if (r && !r.available) {
        alert("لا يمكن إرسال العينة؛ المحلول نافذ حالياً بالمستشفى!");
        return;
      }

      const fileInput = document.getElementById('new-file');
      const attachmentName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "مستند_إحالة_طبي.pdf";

      const newSample = {
        sample_id: smpId,
        patient_ref: patRef,
        department: dept,
        test_type: testType,
        sender_facility: user.facility_name,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "في الطريق إلى مستشفى بريدة المركزي",
        status: "Sent",
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: notes,
        attachment_name: attachmentName,
        result: null
      };

      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);

      db.addLog(`ORDER_PLACED >> Barcode ${smpId} routed to [${dept}] by ${user.facility_name}.`);
      closeModal();
      showToast(`تم إرسال العينة (${smpId}) بنجاح إلى قسم (${dept})!`, 'success');
      renderApp();
    }

    /* --------------------------------------------------------------------------
       MODALS: ATTACHMENT & RESULT PREVIEW
       -------------------------------------------------------------------------- */
    function previewFile(fileName, sampleId) {
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <i data-lucide="paperclip" class="w-5 h-5 text-brand-600"></i>
              <h3 class="font-bold text-slate-900 text-sm">المستند الطبي المرفق (${sampleId})</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center space-y-3">
            <div class="w-12 h-12 bg-blue-100 text-brand-700 rounded-2xl flex items-center justify-center mx-auto">
              <i data-lucide="file-text" class="w-6 h-6"></i>
            </div>
            <p class="text-xs font-bold text-slate-800">${fileName}</p>
            <p class="text-[11px] text-slate-500 leading-relaxed">
              تم إرفاق هذا المستند الطبي مع العينة ومطابقته رقمياً عند الإرسال. مقفل تماماً لمنع التعديل.
            </p>
          </div>
          <div class="flex justify-end">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">إغلاق</button>
          </div>
        </div>
      `);
    }

    function showResultModal(sampleId) {
      const s = db.getSamples().find(item => item.sample_id === sampleId);
      if (!s) return;

      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <div class="p-2 bg-emerald-100 text-emerald-700 rounded-xl"><i data-lucide="file-check-2" class="w-5 h-5"></i></div>
              <div>
                <h3 class="font-bold text-slate-900 text-sm">تقرير النتيجة المخبرية المعتمدة</h3>
                <span class="text-[10px] text-slate-400 font-mono">${s.sample_id}</span>
              </div>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <div><span class="text-slate-400">الباركود:</span> <b class="font-mono text-brand-700">${s.sample_id}</b></div>
            <div><span class="text-slate-400">المريض / النزيل:</span> <b>${s.patient_ref}</b></div>
            <div><span class="text-slate-400">القسم:</span> <b>${s.department}</b></div>
            <div><span class="text-slate-400">الفحص:</span> <b>${s.test_type}</b></div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">التقرير السريري الصادر من جهاز التحليل:</label>
            <div class="p-4 bg-emerald-50/60 text-slate-800 rounded-2xl font-sans text-xs leading-relaxed border border-emerald-200 whitespace-pre-line font-medium">
              ${s.result || 'لا توجد نتيجة مسجلة حتى الآن.'}
            </div>
          </div>

          <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-[11px]">
            <button onclick="window.print()" class="text-brand-600 hover:underline font-bold flex items-center gap-1">
              <i data-lucide="printer" class="w-3.5 h-3.5"></i> طباعة التقرير
            </button>
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">إغلاق</button>
          </div>
        </div>
      `);
    }

    function updateStatus(sampleId, newStatus, newLocation) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      s.status = newStatus;
      s.current_location = newLocation;
      db.saveSamples(samples);
      db.addLog(`STATUS_CHANGE >> ${sampleId} moved to [${newStatus}].`);
      showToast(`تم تحديث حالة العينة (${sampleId})`, 'success');
      renderApp();
    }

    /* ==========================================================================
       7. GLOBAL ROUTER & NAV CONTROLLER
       ========================================================================== */

    function renderNavbar() {
      const user = db.getUser();
      const slot = document.getElementById('nav-user-slot');

      if (!user) {
        slot.innerHTML = `
          <button onclick="renderAuthView()" class="text-xs font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>تسجيل الدخول / حجز منشأة</span>
          </button>
        `;
      } else {
        slot.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <div class="text-xs font-bold text-slate-800">${user.name}</div>
              <div class="text-[11px] text-slate-400 leading-none">${user.facility_name}</div>
            </div>
            <div class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-brand-700 text-xs">
              ${user.name.charAt(0)}
            </div>
            <button onclick="logoutUser()" title="تسجيل الخروج" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderApp() {
      renderNavbar();
      const user = db.getUser();
      const root = document.getElementById('app-root');

      if (!user) {
        renderAuthView();
        renderLogs();
        return;
      }

      if (user.role === 'specialist') {
        root.innerHTML = renderSpecialistDashboard(user);
      } else {
        root.innerHTML = renderSenderDashboard(user);
      }

      renderLogs();
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      renderApp();
    });
  </script>
</body>
</html>
