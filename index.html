<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabNexus | بوابة الربط المخبري الموحد</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
              600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    /* تنسيق العينات المكتملة */
    .completed-row { opacity: 0.5; filter: grayscale(80%); transition: all 0.3s ease; }
    .completed-row:hover { opacity: 1; filter: grayscale(0%); }
    /* تنسيق شاشة محاكي البوت */
    .terminal-scroll::-webkit-scrollbar { width: 4px; }
    .terminal-scroll::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
    /* LIS Table styles */
    .lis-table th { background: #1e293b; color: #cbd5e1; font-weight: 600; padding: 12px; }
    .lis-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Top Global Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
          <i data-lucide="network" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xl font-extrabold tracking-tight text-slate-900">LabNexus</span>
            <span class="text-[10px] bg-brand-50 text-brand-700 font-bold px-2 py-0.5 rounded-md border border-brand-100">بوابة الربط الموحد</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">منصة الربط المخبري ومزامنة LIS</p>
        </div>
      </div>

      <!-- Live Role Switcher -->
      <div class="hidden lg:flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 text-xs font-bold">
        <button onclick="demoLogin('specialist')" id="nav-btn-spec" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">المركزي</button>
        <button onclick="demoLogin('specialist2')" id="nav-btn-spec2" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">التخصصي</button>
        <button onclick="demoLogin('blood_bank')" id="nav-btn-blood" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">بنك الدم</button>
        <button onclick="demoLogin('rehab_sender')" id="nav-btn-rehab" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">التأهيل</button>
        <button onclick="demoLogin('prison_sender')" id="nav-btn-prison" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">السجن</button>
        <button onclick="demoLogin('lis_node')" id="nav-btn-lis" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">نظام LIS</button>
      </div>

      <!-- User Session Controls -->
      <div class="flex items-center gap-3">
        <!-- زر اختصار لعرض السجلات للمسؤولين -->
        <button onclick="switchAppTab(currentAppTab === 'records' ? 'home' : 'records')" class="px-3 py-1.5 bg-slate-100 text-slate-600 hover:bg-brand-50 hover:text-brand-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i data-lucide="database" class="w-4 h-4"></i>
          <span class="hidden sm:inline" id="top-records-btn">سجلات العينات</span>
        </button>
        <div id="nav-user-slot" class="flex items-center gap-3 border-r border-slate-200 pr-3"></div>
      </div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-box" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- Main Content Stage -->
      <section class="lg:col-span-12">
        <div id="app-root"></div>
      </section>

    </div>

    <!-- ISOLATED AUDIT LOGS SECTION -->
    <div class="mt-20 pt-10 border-t border-slate-200">
      <div class="bg-slate-900 text-slate-200 rounded-3xl p-6 shadow-xl border border-slate-800">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
          <div class="flex items-center gap-2.5">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <h4 class="text-xs font-mono font-bold tracking-wider text-slate-300">سجل الأحداث وتتبع العمليات الطبية</h4>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="clearSystemLogs()" class="text-[11px] text-slate-400 hover:text-rose-400 font-mono transition">تفريغ السجل</button>
            <button onclick="resetAllData()" class="text-[11px] bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg font-mono transition">
              إعادة ضبط الذاكرة (Reset)
            </button>
          </div>
        </div>
        <div id="system-logs-container" class="mt-4 font-mono text-[11px] text-slate-400 space-y-1.5 max-h-40 overflow-y-auto pl-2"></div>
      </div>
    </div>
  </main>

  <!-- Modal Container -->
  <div id="modal-container" class="relative z-50 hidden"></div>

  <script>
    /* ==========================================================================
       1. DATA STRUCTURES & LOCALSTORAGE INITIALIZATION
       ========================================================================== */

    const PRIMARY_HOSPITAL_NAME = "مستشفى بريدة المركزي";
    const SPECIALIST_HOSPITAL_NAME = "مستشفى الملك فهد التخصصي";
    const REHAB_NAME = "مركز التأهيل الشامل";
    const PRISON_NAME = "إدارة سجن بريدة - العيادات الطبية";
    const LIS_NAME = "نظام إدارة المختبرات (LIS)";
    const BLOOD_BANK_NAME = "بنك الدم المركزي (Hematos)";

    const STATUS_MAP = {
      'Pending': { label: 'بانتظار مزامنة LIS', color: 'bg-slate-100 text-slate-700 border-slate-300' },
      'Sent': { label: 'تم الإرسال (بانتظار وصول العينة)', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      'Received': { label: 'استلمت بالمستشفى (مطابقة LIS)', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      'In-Testing': { label: 'قيد الفحص بالجهاز', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      'Completed': { label: 'تم الفحص (معتمد)', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
    };

    const LAB_DEPARTMENTS = [
      { id: "Chemistry", name: "الكيمياء الحيوية (Chemistry)" },
      { id: "Hematology", name: "أمراض الدم (Hematology)" },
      { id: "Microbiology", name: "الأحياء الدقيقة (Microbiology)" },
      { id: "Parasitology", name: "الطفيليات والتحاليل المجهرية (Parasitology)" },
      { id: "Histopathology", name: "علم الأمراض والأنسجة (Histopathology)" },
      { id: "Serology", name: "المناعة والمصليات (Serology)" },
      { id: "BloodBank", name: "بنك الدم ونقل الدم (Blood Bank)" }
    ];

    const INITIAL_FACILITIES = [
      { id: "fac-1", name: PRIMARY_HOSPITAL_NAME, type: "المختبر المرجعي الإقليمي", city: "بريدة", isClaimed: true, owner: "د. عبد الرحمن التويجري" },
      { id: "fac-2", name: REHAB_NAME, type: "مراكز التأهيل والرعاية", city: "بريدة", isClaimed: true, owner: "أخصائي / سلطان الحربي" },
      { id: "fac-3", name: PRISON_NAME, type: "المديرية العامة للسجون", city: "بريدة", isClaimed: true, owner: "رائد طبيب / خالد المطيري" },
      { id: "fac-4", name: LIS_NAME, type: "نظام محاكاة الأجهزة", city: "بريدة", isClaimed: true, owner: "مدير النظام" },
      { id: "fac-5", name: BLOOD_BANK_NAME, type: "مركز نقل الدم", city: "بريدة", isClaimed: true, owner: "أخصائي بنك الدم" },
      { id: "fac-6", name: SPECIALIST_HOSPITAL_NAME, type: "مختبر مستشفى تخصصي", city: "بريدة", isClaimed: true, owner: "د. طارق الفوزان" }
    ];

    const DR0006_FORM_STRUCTURE = [
      {
        col: 1,
        categories: [
          {
            id: "biochem", name: "BIOCHEMISTRY",
            tests: ["GLU (F,R,PP)", "UREA", "CR", "CK-MB", "SGOT (AST)", "SGPT", "ALK. PHOSPHATASE", "ALBUMIN", "T.PROTEIN", "BILIRUBIN", "CHOL", "TG", "HDL", "LDL", "SODIUM", "POTASSIUM", "CHLORIDE", "URIC ACID", "CREATININE", "CALCIUM", "PHOSPHORUS", "LITHIUM", "ALB/CR RATIO (URINE)"]
          }
        ]
      },
      {
        col: 2,
        categories: [
          {
            id: "hema", name: "HEMATOLOGY",
            tests: ["CBC", "BLOOD GROUP", "HB A1C", "SICKLING TEST", "PROTHROMBIN TIME (PT/INR)", "ESR"]
          },
          {
            id: "urine", name: "URINE ANALYSIS",
            tests: ["CHEMICAL", "MICROSCOPIC"]
          },
          {
            id: "stool", name: "STOOL ANALYSIS",
            tests: ["STOOL OVA & PARASITES"]
          },
          {
            id: "micro", name: "MICROBIOLOGY CULTURE",
            tests: ["Blood", "Urine", "Stool", "C.S.F", "Tissue Swab", "Wound Swab", "Sputum", "Nasal", "Semen", "Fluid"]
          },
          {
            id: "vit", name: "VITAMINS & OTHERS",
            tests: ["HEMOGLOBIN ELECTROPHORESIS", "VITAMIN D LEVEL"]
          },
          {
            id: "iron", name: "IRON PROFILE",
            tests: ["SERUM IRON", "FERRITIN"]
          }
        ]
      },
      {
        col: 3,
        categories: [
          {
            id: "virology", name: "VIROLOGY",
            tests: ["ANTI-HCV (Ab)", "HBs Ag", "ANTI-HBs", "ANTI-HIV", "HBe Ag / Ab"]
          },
          {
            id: "hormone", name: "HORMONE PROFILE",
            tests: ["TSH", "FT4", "FT3", "FSH", "LH", "PRL", "TESTOSTERONE", "ESTRADIOL", "PROGESTERONE", "CORTISOL", "ALDOSTERONE"]
          },
          {
            id: "preg", name: "PREGNANCY TEST",
            tests: ["URINE HCG", "BLOOD HCG"]
          },
          {
            id: "psa", name: "PROSTATE SPECIFIC ANTIGEN",
            tests: ["TOTAL PSA", "FREE PSA"]
          },
          {
            id: "other", name: "OTHER TESTS",
            tests: ["OTHER"]
          }
        ]
      }
    ];

    // فصل المخزون لكل مستشفى 
    const INITIAL_REAGENTS = [
      { id: "dr0006_blood_panel", name: "استمارة طلب تحاليل دم (DR-0006 - تحديد متعدد)", dept: "Chemistry", is_manual: false, avail_central: true, avail_specialist: true },
      { id: "urine_culture", name: "زراعة بول وحساسية مضادات", dept: "Microbiology", is_manual: true, manual_type: "culture_worksheet", avail_central: true, avail_specialist: true },
      { id: "expatriate_screening", name: "فحص العمالة الوافدة", dept: "Parasitology", is_manual: true, manual_type: "worker_microbiology", avail_central: true, avail_specialist: true },
      { id: "semen_analysis", name: "تحليل السائل المنوي المجهري", dept: "Parasitology", is_manual: true, manual_type: "semen", avail_central: true, avail_specialist: true },
      { id: "potassium", name: "تحليل البوتاسيوم (Potassium - K+)", dept: "Chemistry", is_manual: false, avail_central: true, avail_specialist: false },
      { id: "cbc", name: "تحليل دم شامل (CBC)", dept: "Hematology", is_manual: false, avail_central: true, avail_specialist: true },
      { id: "toxicology", name: "فحص السموم والمؤثرات العقلية", dept: "Chemistry", is_manual: false, avail_central: false, avail_specialist: true },
      { id: "lft", name: "وظائف كبد وكلى (LFT & RFT)", dept: "Chemistry", is_manual: false, avail_central: true, avail_specialist: true },
      { id: "hiv_hep", name: "فحص الفيروسات والمناعة (Serology)", dept: "Serology", is_manual: false, avail_central: true, avail_specialist: true }
    ];

    // التفريغ بناءً على طلبك لتبدأ بدون عينات
    const INITIAL_SAMPLES = [];

    const INITIAL_BLOOD_INVENTORY = [
      { type: "O+", count: 18 }, { type: "O-", count: 4 },
      { type: "A+", count: 12 }, { type: "A-", count: 2 },
      { type: "B+", count: 6 },  { type: "B-", count: 1 },
      { type: "AB+", count: 3 }, { type: "AB-", count: 1 }
    ];

    let currentAppTab = "home";
    let recordsSearchQuery = "";
    let recordsFacilityFilter = "All";
    let recordsDeptFilter = "All";
    let recordsStatusFilter = "All";
    
    let hospitalActiveTab = "specialist"; 
    let hospitalSenderFilter = "All";

    function initDatabase() {
      if (!localStorage.getItem('ln_facilities')) {
        localStorage.setItem('ln_facilities', JSON.stringify(INITIAL_FACILITIES));
        localStorage.setItem('ln_samples', JSON.stringify(INITIAL_SAMPLES));
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
        localStorage.setItem('ln_blood_inventory', JSON.stringify(INITIAL_BLOOD_INVENTORY));
        localStorage.setItem('ln_logs', JSON.stringify([
          `[${new Date().toLocaleTimeString('en-US')}] SYSTEM_BOOT >> LabNexus Ready.`
        ]));
      }
      
      let currentReagents = JSON.parse(localStorage.getItem('ln_reagents') || '[]');
      const hasSplitInv = currentReagents.some(r => r.avail_central !== undefined);
      if (!currentReagents.length || !hasSplitInv) {
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
      }

      // الدخول الافتراضي للمستشفى المركزي
      if (!localStorage.getItem('ln_user')) {
        demoLogin('specialist');
      }
    }

    const db = {
      getFacilities: () => JSON.parse(localStorage.getItem('ln_facilities') || '[]'),
      saveFacilities: (data) => localStorage.setItem('ln_facilities', JSON.stringify(data)),
      getSamples: () => JSON.parse(localStorage.getItem('ln_samples') || '[]'),
      saveSamples: (data) => localStorage.setItem('ln_samples', JSON.stringify(data)),
      getReagents: () => JSON.parse(localStorage.getItem('ln_reagents') || '[]'),
      saveReagents: (data) => localStorage.setItem('ln_reagents', JSON.stringify(data)),
      getBloodInventory: () => JSON.parse(localStorage.getItem('ln_blood_inventory') || '[]'),
      saveBloodInventory: (data) => localStorage.setItem('ln_blood_inventory', JSON.stringify(data)),
      getUser: () => JSON.parse(localStorage.getItem('ln_user') || 'null'),
      setUser: (user) => localStorage.setItem('ln_user', JSON.stringify(user)),
      clearUser: () => localStorage.removeItem('ln_user'),
      getLogs: () => JSON.parse(localStorage.getItem('ln_logs') || '[]'),
      addLog: (msg) => {
        const logs = JSON.parse(localStorage.getItem('ln_logs') || '[]');
        logs.unshift(`[${new Date().toLocaleTimeString('en-US')}] ${msg}`);
        if (logs.length > 40) logs.pop();
        localStorage.setItem('ln_logs', JSON.stringify(logs));
        renderLogs();
      }
    };

    function loginUser(userData) {
      db.setUser(userData);
      db.addLog(`AUTH >> Logged in: ${userData.name} (${userData.facility_name})`);
      recordsFacilityFilter = "All";
      recordsDeptFilter = "All";
      recordsStatusFilter = "All";
      recordsSearchQuery = "";
      hospitalSenderFilter = "All";
      currentAppTab = "home"; 
      hospitalActiveTab = "specialist";
      renderApp();
      showToast(`مرحباً بك: ${userData.name}`, 'info');
    }

    function logoutUser() {
      db.addLog(`AUTH >> User logged out`);
      db.clearUser();
      renderApp();
      showToast('تم تسجيل الخروج بنجاح', 'info');
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;
      box.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(contentHtml) {
      const modalCont = document.getElementById('modal-container');
      modalCont.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
          <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-200">
            ${contentHtml}
          </div>
        </div>
      `;
      modalCont.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      const modalCont = document.getElementById('modal-container');
      modalCont.classList.add('hidden');
      modalCont.innerHTML = '';
    }

    function renderLogs() {
      const c = document.getElementById('system-logs-container');
      if (!c) return;
      const logs = db.getLogs();
      c.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    }

    function clearSystemLogs() {
      localStorage.setItem('ln_logs', JSON.stringify([]));
      renderLogs();
    }

    function resetAllData() {
      if (confirm("هل أنت متأكد من رغبتك في تفريغ الذاكرة وإعادة الضبط التام؟")) {
        localStorage.clear();
        location.reload();
      }
    }

    function toggleReagent(reagentId) {
      const user = db.getUser();
      const reagents = db.getReagents();
      const item = reagents.find(r => r.id === reagentId);
      if (!item) return;

      let isAvailNow = false;
      if (user.facility_name === PRIMARY_HOSPITAL_NAME) {
        item.avail_central = !item.avail_central;
        isAvailNow = item.avail_central;
      } else {
        item.avail_specialist = !item.avail_specialist;
        isAvailNow = item.avail_specialist;
      }

      db.saveReagents(reagents);

      if (!isAvailNow) {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked OUT OF STOCK at ${user.facility_name}.`);
        showToast(`تم تحديد محلول (${item.name}) كـ "نافذ بالمستشفى".`, 'error');
      } else {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked AVAILABLE at ${user.facility_name}.`);
        showToast(`تم تحديث محلول (${item.name}) كـ "متوفر"`, 'success');
      }
      renderApp();
    }

    function notifyHealthCluster() {
      db.addLog("HEALTH_CLUSTER >> إرسال إخطار للتجمع الصحي حول النواقص المخبرية.");
      showToast("تم إرسال إخطار للتجمع الصحي بنفاذ العينات بنجاح!", "success");
    }

    function changeSampleState(sampleId, targetStatus) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      s.status = targetStatus;
      if (targetStatus === 'Received') {
        s.current_location = "مختبر الاستقبال - " + s.assigned_lab;
      } else if (targetStatus === 'In-Testing') {
        s.current_location = "داخل القسم المختص (قيد الفحص والزرع)";
      } else if (targetStatus === 'Sent') {
        s.current_location = "في الطريق إلى المختبر";
      }

      db.saveSamples(samples);
      db.addLog(`STATUS_CHANGE >> ${sampleId} state updated to [${targetStatus}].`);
      showToast(`تم تعديل حالة العينة (${sampleId}) بنجاح إلى: ${STATUS_MAP[targetStatus].label}`, 'success');
      renderApp();
    }

    function switchAppTab(tab) {
      currentAppTab = tab;
      renderApp();
    }

    // --- نظام موزع الأحمال (Load Balancer) ---
    function getHospitalLoad(hospitalName) {
      const allSamples = db.getSamples();
      const pendingSamples = allSamples.filter(s => s.assigned_lab === hospitalName && s.status !== 'Completed' && s.status !== 'Pending');
      const count = pendingSamples.length;
      
      if (count <= 3) return { level: 1, text: 'إشغال منخفض', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', dot: 'bg-emerald-500' };
      if (count <= 7) return { level: 2, text: 'إشغال متوسط', color: 'text-blue-700 bg-blue-50 border-blue-200', dot: 'bg-blue-500' };
      if (count <= 12) return { level: 3, text: 'مزدحم', color: 'text-amber-700 bg-amber-50 border-amber-200', dot: 'bg-amber-500' };
      return { level: 4, text: 'مزدحم جداً', color: 'text-rose-700 bg-rose-50 border-rose-200', dot: 'bg-rose-500' };
    }

    function getLeastLoadedHospital() {
      const allSamples = db.getSamples();
      const load1 = allSamples.filter(s => s.assigned_lab === PRIMARY_HOSPITAL_NAME && s.status !== 'Completed' && s.status !== 'Pending').length;
      const load2 = allSamples.filter(s => s.assigned_lab === SPECIALIST_HOSPITAL_NAME && s.status !== 'Completed' && s.status !== 'Pending').length;
      return load1 <= load2 ? PRIMARY_HOSPITAL_NAME : SPECIALIST_HOSPITAL_NAME;
    }

       ========================================================================== */

    function getManualTestType(testType) {
      if(!testType) return null;
      const t = testType.toLowerCase();
      if (t.includes("زراعة") || t.includes("مزرعة") || t.includes("culture") || t.includes("worksheet")) return "culture_worksheet";
      if (t.includes("عمالة") || t.includes("وافدة") || t.includes("expatriate")) return "worker_microbiology";
      if (t.includes("منوي") || t.includes("semen")) return "semen";
      return null;
    }

    function openManualEntryModal(sampleId) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const manualType = s.manual_type || getManualTestType(s.test_type);
      if (manualType === "culture_worksheet") renderCultureWorksheetForm(s);
      else if (manualType === "worker_microbiology") renderWorkerMicrobiologyForm(s);
      else if (manualType === "semen") renderSemenAnalysisForm(s);
      else showToast("هذا الفحص غير مرتبط باستمارة يدوية", "error");
    }

    function handleSaveCultureWorksheet(e, sampleId) {
      e.preventDefault();
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const structured = {
        template: "culture_worksheet",
        specimen: document.getElementById('cw_specimen').value,
        collection_method: document.querySelector('input[name="cw_method"]:checked')?.value || 'Midstream',
        plate1: {
          name: document.getElementById('cw_p1_name').value,
          growth: document.querySelector('input[name="cw_p1_g"]:checked')?.value || 'Growth',
          count: document.getElementById('cw_p1_count').value,
          morph: document.getElementById('cw_p1_morph').value,
          color: document.getElementById('cw_p1_color').value
        },
        plate2: {
          name: document.getElementById('cw_p2_name').value,
          growth: document.querySelector('input[name="cw_p2_g"]:checked')?.value || 'Growth',
          count: document.getElementById('cw_p2_count').value,
          morph: document.getElementById('cw_p2_morph').value,
          color: document.getElementById('cw_p2_color').value
        },
        isolate1: {
          organism: document.getElementById('cw_iso1_org').value,
          key: document.getElementById('cw_iso1_key').value
        },
        final_organism: document.getElementById('cw_final_org').value,
        comments: document.getElementById('cw_final_com').value,
        reported_by: document.getElementById('cw_rep_by').value,
        checked_by: document.getElementById('cw_chk_by').value
      };

      s.status = "Completed";
      s.current_location = "تم الاعتماد من قسم الميكروبيولوجي";
      s.structured_data = structured;
      s.result = `[URINE / STOOL CULTURE – WORKSHEET]
• Final Organism: ${structured.final_organism}
• Specimen: ${structured.specimen} (${structured.collection_method})
• Growth Observation: Plate 1 (${structured.plate1.name} - ${structured.plate1.count}) | Plate 2 (${structured.plate2.name} - ${structured.plate2.count})
• AST Sensitivity Summary: Sensitive to Ciprofloxacin, Nitrofurantoin, Ceftriaxone, Gentamicin. Resistant to Ampicillin & SXT.
• Comments: ${structured.comments}`;

      db.saveSamples(samples);
      db.addLog(`CULTURE_WORKSHEET >> Sample [${sampleId}] verified and recorded.`);
      closeModal();
      showToast(`تم اعتماد وحفظ ورقة عمل المزرعة للعينة بنجاح!`, 'success');
      renderApp();
    }

    function autoProcessIncomingBarcode(barcode) {
      const samples = db.getSamples();
      const target = samples.find(s => s.sample_id.trim().toUpperCase() === barcode.trim().toUpperCase());

      if (!target) return;
      if (target.status === 'Completed') return;

      target.status = "Completed";
      target.current_location = "تم الإنهاء بواسطة جهاز التحليل الآلي";
      target.result = generateRealClinicalResult(target.test_type, target.patient_ref);
      db.saveSamples(samples);

      db.addLog(`AUTO_MATCH >> Barcode [${barcode}] matched. Status moved to [تم الفحص].`);
      showToast(`تم الفحص: استلم النظام نتيجة العينة (${barcode}) وتم اعتمادها وتحديثها تلقائياً!`, 'success');
      renderApp();
    }

    async function backgroundDeviceListener() {
      try {
        const res = await fetch('http://localhost:5000/api/port-data');
        if (res.ok) {
          const data = await res.json();
          if (data.readings && data.readings.length > 0) {
            data.readings.forEach(item => {
              if (item.barcode) autoProcessIncomingBarcode(item.barcode);
            });
          }
        }
      } catch (e) {}
    }
    setInterval(backgroundDeviceListener, 2000);

       4. LIS RPA SYNC (نظام المطابقة والاستلام الآلي)
       ========================================================================== */
    function startLisRpaSync() {
      const samples = db.getSamples();
      
      // LIS مرتبط بالمركزي فقط، لذلك يقرأ العينات المتجهة للمركزي والتي لم يتم استلامها بعد (Sent)
      const incomingSent = samples.filter(s => s.status === 'Sent' && s.assigned_lab === PRIMARY_HOSPITAL_NAME);

      openModal(`
        <div class="p-6 bg-slate-900 text-slate-300 rounded-3xl overflow-hidden shadow-2xl border border-slate-700">
          <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="cpu" class="w-5 h-5 text-emerald-400"></i>
              <h3 class="font-bold text-white text-sm">LIS Integration Node (RPA Sync)</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div id="rpa-terminal" class="font-mono text-xs space-y-2 h-48 overflow-y-auto pr-2 terminal-scroll" dir="ltr">
            <div class="text-slate-500">> Initiating connection with Central Hospital Receiving Database...</div>
          </div>
        </div>
      `);
      lucide.createIcons();
      
      const terminal = document.getElementById('rpa-terminal');
      const delay = (ms) => new Promise(res => setTimeout(res, ms));
      
      (async () => {
        if(incomingSent.length === 0) {
          await delay(800);
          terminal.innerHTML += `<div class="text-amber-400">> No new incoming samples found in transit to Central Hospital.</div>`;
          terminal.scrollTop = terminal.scrollHeight;
          return;
        }

        await delay(800);
        terminal.innerHTML += `<div class="text-emerald-400">> [1/3] Connection established successfully.</div>`;
        terminal.scrollTop = terminal.scrollHeight;
        
        await delay(1200);
        terminal.innerHTML += `<div class="text-blue-400">> [2/3] Found ${incomingSent.length} samples registered by peripheral sites (Rehab/Prison/etc). Scanning barcodes...</div>`;
        terminal.scrollTop = terminal.scrollHeight;
        
        await delay(1500);
        for (let i = 0; i < incomingSent.length; i++) {
          const s = incomingSent[i];
          s.status = "Received";
          s.current_location = "استلمت بالمستشفى (مطابقة LIS)";
          db.saveSamples(samples);
        }
        terminal.innerHTML += `<div class="text-emerald-400">  ↳ Automatically updated ${incomingSent.length} samples to 'RECEIVED'. Status synced to LabNexus.</div>`;
        terminal.scrollTop = terminal.scrollHeight;

        db.addLog(`LIS_RPA_SYNC >> Matched and received ${incomingSent.length} samples at Central Hospital.`);
        
        terminal.innerHTML += `<div class="text-white font-bold bg-emerald-600/20 p-2 border border-emerald-500/30 rounded mt-3">> [3/3] Synchronization complete. Updating Worklist...</div>`;
        terminal.scrollTop = terminal.scrollHeight;
        
        await delay(2000);
        closeModal();
        showToast('تم تحديث حالة العينات الواردة إلى "تم الاستلام" بنجاح', 'success');
        renderApp();
      })();
    }

    function updateTestTypes(dept) {
      const select = document.getElementById('new-test-type');
      if(!dept) {
        select.innerHTML = '<option value="">-- يرجى اختيار القسم أولاً --</option>';
        return;
      }
      
      const user = db.getUser();
      const isLis = user.facility_name === LIS_NAME;
      const isDoctor = user.role === 'specialist' && hospitalActiveTab === 'doctor';
      
      let destHospital = PRIMARY_HOSPITAL_NAME;
      if (isLis) {
        destHospital = PRIMARY_HOSPITAL_NAME; // LIS مربوط بالمركزي دائماً
      } else if (isDoctor) {
        destHospital = user.facility_name;
      } else {
        const rad = document.querySelector('input[name="dest_hospital"]:checked');
        if (rad) destHospital = rad.value;
      }

      const isCentral = destHospital === PRIMARY_HOSPITAL_NAME;
      const reagents = db.getReagents().filter(r => r.dept === dept);
      
      select.innerHTML = '<option value="">-- اضغط لاختيار الفحص --</option>' +
          reagents.map(r => {
            const isAvail = isCentral ? r.avail_central : r.avail_specialist;
            const statusText = isAvail ? " [✓ متوفر]" : " [✖ نافذ]";
            return `<option value="${r.name}" ${!isAvail ? 'disabled' : ''}>${r.name} ${statusText}</option>`;
          }).join('');
      
      const drContainer = document.getElementById('dr0006-checklist-container');
      if (drContainer) drContainer.classList.add('hidden');
    }

    function onTestTypeChanged(selectElem) {
      const testName = selectElem.value;
      const isDr = testName.includes("DR-0006") || testName.includes("تحاليل دم");
      const drContainer = document.getElementById('dr0006-checklist-container');
      if (drContainer) {
        if (isDr) drContainer.classList.remove('hidden');
        else drContainer.classList.add('hidden');
      }
    }

    function handleCreateSample(e) {
      e.preventDefault();
      const user = db.getUser();
      const isLis = user.facility_name === LIS_NAME;
      const isDoctor = user.role === 'specialist' && hospitalActiveTab === 'doctor';
      
      const smpId = document.getElementById('new-smp-id').value.trim();
      const testType = document.getElementById('new-test-type').value;

      let assignedLab = PRIMARY_HOSPITAL_NAME;
      let initStatus = "Sent";
      let initLocation = "في الطريق إلى المختبر";

      if (isDoctor) {
        assignedLab = user.facility_name;
        initStatus = "Received";
        initLocation = "طلب داخلي (من العيادة)";
      } else if (isLis) {
        assignedLab = PRIMARY_HOSPITAL_NAME;
        initStatus = "Pending";
        initLocation = "محفوظة محلياً (LIS)";
      } else {
        const destRadio = document.querySelector('input[name="dest_hospital"]:checked');
        if (destRadio) assignedLab = destRadio.value;
        initLocation = "في الطريق إلى " + assignedLab;
      }

      let selectedTests = [];
      if (testType.includes("DR-0006") || testType.includes("تحاليل دم")) {
        document.querySelectorAll('input[name="dr_test_box"]:checked').forEach(cb => { selectedTests.push(cb.value); });
      }

      const manualType = getManualTestType(testType);

      const newSample = {
        sample_id: smpId,
        patient_ref: document.getElementById('new-pat-ref').value.trim(),
        department: document.getElementById('new-dept-select').value,
        test_type: testType,
        is_manual: Boolean(manualType),
        manual_type: manualType,
        selected_tests: selectedTests,
        sender_facility: user.facility_name,
        assigned_lab: assignedLab,
        current_location: initLocation,
        status: initStatus,
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: document.getElementById('new-notes').value.trim(),
        attachment_name: null,
        result: null,
        structured_data: null,
        ordered_by: user.name
      };

      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);

      if (isLis) {
        db.addLog(`LIS_LOCAL >> Barcode ${smpId} saved locally.`);
        showToast(`تم حفظ طلب محلي في LIS`, 'success');
      } else {
        db.addLog(`ORDER_PLACED >> Barcode ${smpId} routed to [${assignedLab}].`);
        showToast(`تم الإرسال بنجاح إلى (${assignedLab})`, 'success');
      }
      
      closeModal();
      renderApp();
    }

          <div class="text-right hidden sm:block">
            <div class="text-xs font-bold text-slate-800">${user.name}</div>
            <div class="text-[10px] text-slate-400 font-bold leading-tight">${user.facility_name}</div>
          </div>
          <button onclick="logoutUser()" title="تسجيل الخروج" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        `;
      }
      lucide.createIcons();
    }

    function renderApp() {
      renderNavbar();
      const user = db.getUser();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!user) { renderAuthView(); renderLogs(); return; }

      if (currentAppTab === 'records') {
        root.innerHTML = renderRecordsView();
      } else {
        if (user.role === 'specialist') root.innerHTML = renderHospitalDashboard(user);
        else if (user.role === 'blood_bank') root.innerHTML = renderBloodBankDashboard(user);
        else if (user.facility_name === LIS_NAME) root.innerHTML = renderLisDashboard(user);
        else root.innerHTML = renderSenderDashboard(user);
      }

      renderLogs();
      lucide.createIcons();
    }

    function demoLogin(type) {
      if (type === 'specialist') loginUser({ id: "usr-spec", name: "أخصائي / صالح الحربي", role: "specialist", facility_name: PRIMARY_HOSPITAL_NAME });
      else if (type === 'specialist2') loginUser({ id: "usr-spec2", name: "د. طارق الفوزان", role: "specialist", facility_name: SPECIALIST_HOSPITAL_NAME });
      else if (type === 'rehab_sender') loginUser({ id: "usr-rehab", name: "أخصائي / سلطان الحربي", role: "sender", facility_name: REHAB_NAME });
      else if (type === 'prison_sender') loginUser({ id: "usr-prison", name: "رائد طبيب / خالد المطيري", role: "sender", facility_name: PRISON_NAME });
      else if (type === 'lis_node') loginUser({ id: "usr-lis", name: "مدير نظام LIS", role: "integration", facility_name: LIS_NAME });
      else if (type === 'blood_bank') loginUser({ id: "usr-blood", name: "أخصائي بنك الدم", role: "blood_bank", facility_name: BLOOD_BANK_NAME });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      renderApp();
    });
  </script>
</body>
</html>
