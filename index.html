<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Top Global Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">

        <div>
          <div class="flex items-center gap-2">
            <span class="text-xl font-extrabold tracking-tight text-slate-900">LabNexus</span>

          <p class="text-xs text-slate-400 hidden sm:block">ربط عيادات السجون والمستوصفات مع مستشفى بريدة المركزي</p>

      </div>

      <!-- Live Role Switcher -->
      <div class="hidden md:flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 text-xs font-bold">
        <button onclick="demoLogin('specialist')" id="nav-btn-spec" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">

        <button onclick="demoLogin('prison_sender')" id="nav-btn-prison" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">
          عيادات السجن
        </button>
        <button onclick="demoLogin('clinic_sender')" id="nav-btn-clinic" class="px-3 py-1.5 rounded-xl transition text-slate-600 hover:text-slate-900">
          المستوصف (رقيم)

      </div>

      <!-- User Session Controls -->
      <div id="nav-user-slot" class="flex items-center gap-3"></div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-box" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="app-root"></div>

    <!-- ISOLATED AUDIT LOGS SECTION -->
    <div class="mt-20 pt-10 border-t border-slate-200">
      <div class="bg-slate-900 text-slate-200 rounded-3xl p-6 shadow-xl border border-slate-800">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
          <div class="flex items-center gap-2.5">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <h4 class="text-xs font-mono font-bold tracking-wider text-slate-300">سجل الأحداث والمطابقة التلقائية للأجهزة والنماذج</h4>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="clearSystemLogs()" class="text-[11px] text-slate-400 hover:text-rose-400 font-mono transition">تفريغ السجل</button>
            <button onclick="resetAllData()" class="text-[11px] bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg font-mono transition">

        <div id="system-logs-container" class="mt-4 font-mono text-[11px] text-slate-400 space-y-1.5 max-h-40 overflow-y-auto pl-2">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Container -->
  <div id="modal-container" class="relative z-50 hidden"></div>

  <script>

    // قائمة الفحوصات: العمالة الوافدة نُقلت للطفيليات + إضافة مزرعة البول والبراز للمايكرو

      { id: "potassium", name: "تحليل البوتاسيوم (Potassium - K+)", dept: "Chemistry", is_manual: false, available: false },
      { id: "cbc", name: "تحليل دم شامل (CBC)", dept: "Hematology", is_manual: false, available: true },
      { id: "toxicology", name: "فحص السموم والمؤثرات العقلية", dept: "Chemistry", is_manual: false, available: true },
      { id: "lft", name: "وظائف كبد وكلى (LFT & RFT)", dept: "Chemistry", is_manual: false, available: true },
      { id: "hiv_hep", name: "فحص الفيروسات والمناعة (Serology)", dept: "Serology", is_manual: false, available: true }
    ];

    const INITIAL_SAMPLES = [
      {
        sample_id: "SMP-CULT-901",
        patient_ref: "نزيل - 6612",
        department: "Microbiology",
        test_type: "مزرعة وحساسية البول والبراز (Urine / Stool Culture - Worksheet)",
        is_manual: true,
        manual_type: "culture_worksheet",
        sender_facility: PRISON_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "حاضنة قسم الميكروبيولوجي",
        status: "Received",
        created_at: "2026-09-07 12:00",
        notes: "اشتباه التهاب بكتيري حاد بالمسالك البولية، مطلوب عزل البكتيريا وفحص الحساسية",

        result: null,
        structured_data: null
      },
      {

        patient_ref: "وافدة - 1092",
        department: "Parasitology",
        test_type: "فحص العمالة الوافدة (Expatriate Screening)",
        is_manual: true,
        manual_type: "worker_microbiology",
        sender_facility: CLINIC_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "قسم الطفيليات - وحدة فحص العمالة",
        status: "Received",
        created_at: "2026-09-07 11:45",
        notes: "فحص الإقامة الدوري للعمالة الوافدة - قسم النساء",
        attachment_name: "نموذج_إحالة_فحص_عمالة.pdf",
        result: null,
        structured_data: null
      },
      {
        sample_id: "SMP-MANUAL-701",
        patient_ref: "نزيل - 9104",
        department: "Parasitology",
        test_type: "تحليل السائل المنوي المجهري (Semen Analysis)",
        is_manual: true,
        manual_type: "semen",
        sender_facility: PRISON_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "وحدة المجهر والباراسايتولوجي",
        status: "Received",
        created_at: "2026-09-07 11:30",
        notes: "تحليل سريري مجهري مطلوب متابعته مع الاستمارة",
        attachment_name: "سجل_النزيل_السريري.pdf",
        result: null,
        structured_data: null
      },
      {
        sample_id: "SMP-BRY-101",
        patient_ref: "نزيل - 8812",
        department: "Chemistry",
        test_type: "فحص السموم والمؤثرات العقلية",
        is_manual: false,
        sender_facility: PRISON_NAME,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "في الطريق إلى المختبر",

        result: null,
        structured_data: null
      }
    ];

    function initDatabase() {
      if (!localStorage.getItem('ln_facilities')) {
        localStorage.setItem('ln_facilities', JSON.stringify(INITIAL_FACILITIES));
      }
      if (!localStorage.getItem('ln_samples')) {
        localStorage.setItem('ln_samples', JSON.stringify(INITIAL_SAMPLES));
      }
      if (!localStorage.getItem('ln_reagents')) {
        localStorage.setItem('ln_reagents', JSON.stringify(INITIAL_REAGENTS));
      }
      if (!localStorage.getItem('ln_logs')) {
        localStorage.setItem('ln_logs', JSON.stringify([
          `[${new Date().toLocaleTimeString('en-US')}] SYSTEM_BOOT >> LabNexus Ready. Expatriate screening mapped to Parasitology. Culture Worksheet added to Microbiology.`
        ]));
      }
      if (!localStorage.getItem('ln_user')) {
        loginUser({
          id: "usr-spec",
          name: "أخصائي / صالح الحربي",
          email: "lab.buraydah@labnexus.sa",
          role: "specialist",
          facility_id: "fac-1",
          facility_name: PRIMARY_HOSPITAL_NAME
        });
      }
    }

    const db = {
      getFacilities: () => JSON.parse(localStorage.getItem('ln_facilities') || '[]'),
      saveFacilities: (data) => localStorage.setItem('ln_facilities', JSON.stringify(data)),
      getSamples: () => JSON.parse(localStorage.getItem('ln_samples') || '[]'),
      saveSamples: (data) => localStorage.setItem('ln_samples', JSON.stringify(data)),
      getReagents: () => JSON.parse(localStorage.getItem('ln_reagents') || '[]'),
      saveReagents: (data) => localStorage.setItem('ln_reagents', JSON.stringify(data)),
      getUser: () => JSON.parse(localStorage.getItem('ln_user') || 'null'),
      setUser: (user) => localStorage.setItem('ln_user', JSON.stringify(user)),
      clearUser: () => localStorage.removeItem('ln_user'),
      getLogs: () => JSON.parse(localStorage.getItem('ln_logs') || '[]'),
      addLog: (msg) => {
        const logs = JSON.parse(localStorage.getItem('ln_logs') || '[]');
        logs.unshift(`[${new Date().toLocaleTimeString('en-US')}] ${msg}`);
        if (logs.length > 40) logs.pop();
        localStorage.setItem('ln_logs', JSON.stringify(logs));
        renderLogs();
      }
    };

    function loginUser(userData) {
      db.setUser(userData);
      db.addLog(`AUTH >> Logged in: ${userData.name} (${userData.facility_name})`);
      renderApp();
      showToast(`مرحباً بك: ${userData.name}`, 'info');
    }

    function logoutUser() {
      db.addLog(`AUTH >> User logged out`);
      db.clearUser();
      renderApp();
      showToast('تم تسجيل الخروج بنجاح', 'info');
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-box');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;
      box.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(contentHtml) {
      const modalCont = document.getElementById('modal-container');
      modalCont.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
          <div class="bg-white rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-200">
            ${contentHtml}
          </div>
        </div>
      `;
      modalCont.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      const modalCont = document.getElementById('modal-container');
      modalCont.classList.add('hidden');
      modalCont.innerHTML = '';
    }

    function renderLogs() {
      const c = document.getElementById('system-logs-container');
      if (!c) return;
      const logs = db.getLogs();
      c.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
    }

    function clearSystemLogs() {
      localStorage.setItem('ln_logs', JSON.stringify([]));
      renderLogs();
    }

    function resetAllData() {
      if (confirm("هل أنت متأكد من رغبتك في تفريغ الذاكرة والبدء من جديد؟")) {
        localStorage.clear();
        location.reload();
      }
    }

    function toggleReagent(reagentId) {
      const reagents = db.getReagents();
      const item = reagents.find(r => r.id === reagentId);
      if (!item) return;

      item.available = !item.available;
      db.saveReagents(reagents);

      if (!item.available) {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked OUT OF STOCK.`);
        showToast(`تم تحديد محلول (${item.name}) كـ "نافذ بالمستشفى". تم حظر إرساله فوراً!`, 'error');
      } else {
        db.addLog(`REAGENT_ALERT >> ${item.name} marked AVAILABLE.`);
        showToast(`تم تحديث محلول (${item.name}) كـ "متوفر"`, 'success');
      }
      renderApp();
    }

    function changeSampleState(sampleId, targetStatus) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      s.status = targetStatus;
      if (targetStatus === 'Received') {
        s.current_location = "مختبر الاستقبال - مستشفى بريدة";
      } else if (targetStatus === 'In-Testing') {
        s.current_location = "داخل القسم المختص (قيد الفحص والزرع)";
      } else if (targetStatus === 'Sent') {
        s.current_location = "في الطريق إلى المختبر";
      }

      db.saveSamples(samples);
      db.addLog(`STATUS_CHANGE >> ${sampleId} state updated to [${targetStatus}].`);
      showToast(`تم تعديل حالة العينة (${sampleId}) بنجاح إلى: ${STATUS_MAP[targetStatus].label}`, 'success');
      renderApp();
    }

    /* ==========================================================================
       2. MANUAL TEMPLATE REGISTRY (CULTURE WORKSHEET + WORKER + SEMEN)
       ========================================================================== */

    function getManualTestType(testType) {
      const t = testType.toLowerCase();
      if (t.includes("مزرعة") || t.includes("culture") || t.includes("worksheet")) return "culture_worksheet";
      if (t.includes("عمالة") || t.includes("وافدة") || t.includes("expatriate")) return "worker_microbiology";
      if (t.includes("منوي") || t.includes("semen")) return "semen";
      return null;
    }

    function openManualEntryModal(sampleId) {
      const samples = db.getSamples();
      const s = samples.find(item => item.sample_id === sampleId);
      if (!s) return;

      const manualType = s.manual_type || getManualTestType(s.test_type);
      if (manualType === "culture_worksheet") {
        renderCultureWorksheetForm(s);
      } else if (manualType === "worker_microbiology") {
        renderWorkerMicrobiologyForm(s);
      } else {
        renderSemenAnalysisForm(s);
      }
    }

    // 1. جدول ورقة عمل المزارع المخبرية (URINE / STOOL CULTURE – WORKSHEET)

                <h3 class="font-extrabold text-slate-900 text-sm">URINE / STOOL CULTURE – WORKSHEET</h3>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5">قسم الأحياء الدقيقة (Microbiology Section) | كود العينة: ${s.sample_id}</p>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <form onsubmit="handleSaveCultureWorksheet(event, '${s.sample_id}')" class="space-y-4 text-xs">
            
            <!-- A. Specimen & Initial Workup -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 space-y-3">
              <span class="font-bold text-slate-800 text-xs block border-b border-slate-200 pb-1.5 flex items-center gap-1.5">
                <i data-lucide="flask-conical" class="w-3.5 h-3.5 text-brand-600"></i>
                1. الفحص المبدئي والوسط الزراعي (Initial Culture & Macroscopy)
              </span>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">نوع العينة (Specimen)</label>
                  <select id="cw_specimen" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg font-bold">
                    <option value="Urine (Midstream)">Urine (بول - منتصف التبول)</option>
                    <option value="Stool (Feces)">Stool (براز)</option>
                    <option value="Catheterized Urine">Urine (قسطرة بولية)</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">المظهر الفيزيائي</label>
                  <input id="cw_macro" type="text" value="Turbid / Amber" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg">
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">صبغة غرام (Gram Stain)</label>
                  <input id="cw_gram" type="text" value="Gram Negative Bacilli (GNB)" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg">
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">العدد المستعمري (Colony Count)</label>
                  <input id="cw_count" type="text" value="> 100,000 CFU/mL (Significant)" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg font-mono">
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">الأوساط الزراعية المستخدمة (Media Used)</label>
                  <input id="cw_media" type="text" value="Blood Agar + MacConkey + CLED Agar" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg">
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">البكتيريا المعزولة (Isolated Pathogen)</label>
                  <input id="cw_organism" type="text" value="Escherichia coli (E. coli)" class="w-full px-2.5 py-1.5 bg-white border border-brand-300 rounded-lg font-bold text-brand-800">
                </div>
              </div>
            </div>

            <!-- B. Antibiotic Susceptibility Testing (AST) Table -->

    function generateRealClinicalResult(testType, patientRef) {
      const t = testType.toLowerCase();
      const timeStr = new Date().toLocaleTimeString('ar-SA');

      if (t.includes("دم") || t.includes("cbc")) {
        return `[تقرير تحليل الدم الشامل CBC - معتمد]
• خضاب الدم (Hemoglobin): 14.6 g/dL (المعدل الطبيعي: 13.5 - 17.5)
• كريات الدم البيضاء (WBC): 6.2 x10^3/uL (المعدل الطبيعي: 4.5 - 11.0)
• الصفائح الدموية (Platelets): 238 x10^3/uL (المعدل الطبيعي: 150 - 450)
• خلايا الدم الحمراء (RBC): 4.8 x10^6/uL (المعدل الطبيعي: 4.3 - 5.9)
النتيجة: الفحص طبيعي وسليم وخالٍ من مؤشرات فقر الدم أو الالتهاب.
وقت التحليل: ${timeStr} | الجهاز: Sysmex XN Automated Analyzer`;
      } 
      else if (t.includes("سموم") || t.includes("toxicology")) {
        return `[تقرير فحص السموم والمؤثرات العقلية - قطاع السجون]
• مشتقات الأفيونات: سلبية (Negative)
• الأمفيتامين والشبو: سلبية (Negative)
• الحشيش والقنب: سلبية (Negative)
النتيجة النهائية: العينة سلبية وسليمة لكافة المواد الخاضعة للرقابة.
تمت المعايرة والمطابقة المخبرية آلياً بواسطة Cobas Analyzer.`;
      } 
      else if (t.includes("كبد") || t.includes("كلى") || t.includes("lft")) {
        return `[تقرير وظائف الأعضاء وكيمياء الدم]
• الكرياتينين: 0.9 mg/dL (طبيعي: 0.7 - 1.3)
• نيتروجين اليوريا: 13 mg/dL (طبيعي: 7 - 20)
• إنزيم الكبد (ALT): 21 U/L (طبيعي: 7 - 56)
النتيجة: المؤشرات الحيوية للكبد والكلى سليمة وضمن النطاقات المرجعية.`;

      else {
        return `[تقرير مخبري معتمد]
تم الفحص بواسطة جهاز التحليل الآلي بنجاح. كافة المؤشرات الحيوية طبيعية ومطابقة للمعايير.`;
      }
    }

    function autoProcessIncomingBarcode(barcode) {
      const samples = db.getSamples();
      const target = samples.find(s => s.sample_id.trim().toUpperCase() === barcode.trim().toUpperCase());

      if (!target) return;
      if (target.status === 'Completed') return;

      target.status = "Completed";
      target.current_location = "تم الإنهاء بواسطة جهاز التحليل الآلي";
      target.result = generateRealClinicalResult(target.test_type, target.patient_ref);
      db.saveSamples(samples);

      db.addLog(`AUTO_MATCH >> Barcode [${barcode}] matched. Status moved to [تم الفحص].`);
      showToast(`تم الفحص: استلم النظام نتيجة العينة (${barcode}) وتم اعتمادها وتحديثها تلقائياً!`, 'success');
      renderApp();
    }

    async function backgroundDeviceListener() {
      try {
        const res = await fetch('http://localhost:5000/api/port-data');
        if (res.ok) {
          const data = await res.json();
          if (data.readings && data.readings.length > 0) {
            data.readings.forEach(item => {
              if (item.barcode) autoProcessIncomingBarcode(item.barcode);
            });
          }
        }
      } catch (e) {}
    }
    setInterval(backgroundDeviceListener, 2000);

                            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                            ${s.current_location}
                          </span>
                        `}
                      </div>
                    </div>

                    <div class="pt-2">
                      <div class="grid grid-cols-4 gap-2">
                        ${steps.map((label, idx) => {
                          const stepNum = idx + 1;
                          const isDone = curStep >= stepNum;
                          return `
                            <div class="flex flex-col items-center text-center">
                              <div class="w-full h-1.5 rounded-full ${isDone ? 'bg-brand-600' : 'bg-slate-200'} mb-2"></div>

                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function checkReagentAvailability(testName) {
      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testName);
      const banner = document.getElementById('reagent-blocked-banner');
      const submitBtn = document.getElementById('btn-submit-sample');
      const deptSelect = document.getElementById('new-dept-select');

      if (r) {
        if (deptSelect && r.dept) deptSelect.value = r.dept;
        if (!r.available) {
          banner.classList.remove('hidden');
          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
          return;
        }
      }

      banner.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
      lucide.createIcons();
    }

    function updateFileLabel(input) {
      const lbl = document.getElementById('file-label-text');
      if (input.files && input.files[0]) {
        lbl.innerHTML = `<span class="text-brand-700 font-bold">تم اختيار: ${input.files[0].name}</span>`;
      }
    }

    function handleCreateSample(e) {
      e.preventDefault();
      const user = db.getUser();
      const smpId = document.getElementById('new-smp-id').value.trim();
      const patRef = document.getElementById('new-pat-ref').value.trim();
      const dept = document.getElementById('new-dept-select').value;
      const testType = document.getElementById('new-test-type').value;
      const notes = document.getElementById('new-notes').value.trim();

      const reagents = db.getReagents();
      const r = reagents.find(item => item.name === testType);
      if (r && !r.available) {
        alert("لا يمكن إرسال العينة؛ المحلول نافذ حالياً بالمستشفى!");
        return;
      }

      const fileInput = document.getElementById('new-file');
      const attachmentName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "مستند_إحالة_طبي.pdf";

      const manualType = getManualTestType(testType);

      const newSample = {
        sample_id: smpId,
        patient_ref: patRef,
        department: dept,
        test_type: testType,
        is_manual: Boolean(manualType),
        manual_type: manualType,
        sender_facility: user.facility_name,
        assigned_lab: PRIMARY_HOSPITAL_NAME,
        current_location: "في الطريق إلى مستشفى بريدة المركزي",
        status: "Sent",
        created_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
        notes: notes,
        attachment_name: attachmentName,
        result: null,
        structured_data: null
      };

      const samples = db.getSamples();
      samples.unshift(newSample);
      db.saveSamples(samples);

      db.addLog(`ORDER_PLACED >> Barcode ${smpId} (${testType}) routed to [${dept}].`);
      closeModal();
      showToast(`تم إرسال العينة (${smpId}) بنجاح إلى قسم (${dept})!`, 'success');
      renderApp();
    }
